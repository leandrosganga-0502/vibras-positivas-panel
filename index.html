  compra:                 {label:'Ingreso de stock (compra)',badge:'badge-gray', ic:'⬆️'},
  produccion_terminado:   {label:'Producción (sublimado)',   badge:'badge-green', ic:'🔥'},
  consumo_materia_prima:  {label:'Consumo materia prima',    badge:'badge-gray', ic:'🧱'},
  consumo_insumo:         {label:'Consumo de insumo',         badge:'badge-gray', ic:'🎨'},
};

let movTipoFiltro = 'todos';
async function renderMovimientos(main){
  const filtrados = movTipoFiltro==='todos' ? state.movimientos : state.movimientos.filter(m=>m.tipo===movTipoFiltro);
  const ultimos = [...filtrados].sort((a,b)=> (b.fecha+b.id).localeCompare(a.fecha+a.id)).slice(0,60);

  main.innerHTML = `
    <div class="topbar">
      <div>
        <h1 class="view-title">Movimientos de stock</h1>
        <p class="view-sub">Ventas, envíos a consignación, mermas y compras</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline" id="btnCompraMov">⬆️ Registrar compra</button>
        <button class="btn btn-outline" id="btnCompraMasivaMov">📋 Compra por planilla</button>
        <button class="btn btn-teal" id="btnEnvioMasivoPlastipel">📦 Envío masivo a Plastipel</button>
        <button class="btn btn-primary" id="btnNuevoMov">+ Registrar movimiento</button>
      </div>
    </div>
    <div class="grad-bar"></div>

    <div class="filter-bar">
      <select id="filtroTipoMov">
        <option value="todos" ${movTipoFiltro==='todos'?'selected':''}>Todos los tipos</option>
        ${Object.keys(TIPO_INFO).map(tipo=>`<option value="${tipo}" ${movTipoFiltro===tipo?'selected':''}>${TIPO_INFO[tipo].ic} ${TIPO_INFO[tipo].label}</option>`).join('')}
      </select>
      <span style="font-size:12.5px;color:var(--ink-soft);">${filtrados.length} movimiento${filtrados.length===1?'':'s'}${ultimos.length<filtrados.length ? ` (mostrando los últimos ${ultimos.length})` : ''}</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th>Cant.</th><th>Total</th><th>Detalle</th><th></th></tr></thead>
        <tbody id="movBody"></tbody>
      </table>
    </div>
    ${!ultimos.length ? `<div class="empty">${movTipoFiltro==='todos' ? 'Todavía no registraste movimientos. Empezá con el botón de arriba.' : 'No hay movimientos de este tipo.'}</div>` : ''}
  `;

  const tbody = document.getElementById('movBody');
  ultimos.forEach(m=>{
    const info = TIPO_INFO[m.tipo] || {label:m.tipo, badge:'badge-gray', ic:''};
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="mono" style="white-space:nowrap;">${m.fecha}</td>
      <td><span class="badge ${info.badge}">${info.ic} ${info.label}</span></td>
      <td>${escapeHtml(m.productoNombre)}${m.sobrenombre?` <span class="badge badge-teal">${escapeHtml(m.sobrenombre)}</span>`:''}</td>
      <td class="mono">${m.cantidad}</td>
      <td class="mono">${m.total?money(m.total):'—'}</td>
      <td style="color:var(--ink-soft);font-size:12.5px;">${escapeHtml(m.detalle||'—')}</td>
      <td>
        <button class="btn-icon" data-editmov="${m.id}" title="Editar" style="margin-right:4px;">✎</button>
        <button class="btn-icon" data-delmov="${m.id}" title="Eliminar">✕</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('filtroTipoMov').addEventListener('change', (e)=>{ movTipoFiltro = e.target.value; renderMovimientos(main); });
  document.getElementById('btnNuevoMov').addEventListener('click', ()=>openMovimientoModal(main));
  document.getElementById('btnCompraMov').addEventListener('click', ()=>openMovimientoModal(main, {tipoPreset:'compra'}));
  document.getElementById('btnCompraMasivaMov').addEventListener('click', ()=>openCompraMasivaModal(main));
  document.getElementById('btnEnvioMasivoPlastipel').addEventListener('click', ()=>openEnvioMasivoModal(main));
  tbody.querySelectorAll('[data-editmov]').forEach(b=>{
    b.addEventListener('click', ()=>openEditarMovimientoModal(b.dataset.editmov, ()=>renderMovimientos(main)));
  });
  tbody.querySelectorAll('[data-delmov]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('¿Eliminar este movimiento? Se recalculará el stock automáticamente.')) return;
      const respaldo = state.movimientos;
      state.movimientos = state.movimientos.filter(m=>m.id!==b.dataset.delmov);
      const ok = await saveMovimientos();
      if(!ok){ state.movimientos = respaldo; renderMovimientos(main); return; }
      syncBackend('eliminarMovimiento', {id: b.dataset.delmov});
      toast('Movimiento eliminado');
      renderMovimientos(main);
    });
  });
}

function openEditarMovimientoModal(movId, onDone){
  const m = state.movimientos.find(x=>x.id===movId);
  if(!m) return;
  const info = TIPO_INFO[m.tipo] || {label:m.tipo};
  const tieneImporte = !['envio_consignacion','devolucion_consignacion','produccion_terminado','consumo_materia_prima','consumo_insumo'].includes(m.tipo);
  const esConsignacion = ['envio_consignacion','liquidacion_consignacion','devolucion_consignacion'].includes(m.tipo);

  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `
    <div class="modal">
      <h3>Editar movimiento</h3>
      <p class="view-sub" style="margin:0 0 14px;">${info.label} · ${escapeHtml(m.productoNombre)}</p>
      <div class="hint-box">💡 El producto y el tipo de movimiento no se pueden cambiar acá — si te equivocaste en eso, lo más simple es eliminar este movimiento y cargarlo de nuevo. Sí podés corregir cantidad, precio, fecha y detalle.</div>
      <div class="field-row">
        <div class="field"><label>Cantidad</label><input id="fEditCantidad" type="number" min="1" value="${m.cantidad}"></div>
        <div class="field"><label>Fecha</label><input id="fEditFecha" type="date" value="${(m.fecha||'').slice(0,10)}"></div>
      </div>
      ${tieneImporte ? `<div class="field"><label>Precio unitario</label><input id="fEditPrecio" type="number" value="${m.precioUnitario||0}"></div>` : ''}
      ${esConsignacion ? `<div class="field"><label>Sobrenombre / diseño (opcional)</label><input id="fEditSobrenombre" value="${escapeHtml(m.sobrenombre||'')}"></div>` : ''}
      <div class="field"><label>Detalle (opcional)</label><input id="fEditDetalle" value="${escapeHtml(m.detalle||'')}"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar cambios</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
  // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.
  wrap.querySelector('#saveBtn').addEventListener('click', async ()=>{
    const cantidad = Number(wrap.querySelector('#fEditCantidad').value)||0;
    if(cantidad<=0){ toast('Ingresá una cantidad válida'); return; }
    const respaldo = {...m};
    m.cantidad = cantidad;
    m.fecha = wrap.querySelector('#fEditFecha').value || m.fecha;
    m.detalle = wrap.querySelector('#fEditDetalle').value.trim();
    if(tieneImporte){
      m.precioUnitario = Number(wrap.querySelector('#fEditPrecio').value)||0;
      m.total = m.precioUnitario * cantidad;
    }
    if(esConsignacion) m.sobrenombre = wrap.querySelector('#fEditSobrenombre').value.trim() || null;

    const btn = wrap.querySelector('#saveBtn');
    btn.textContent = 'Guardando…'; btn.disabled = true;
    const ok = await saveMovimientos();
    btn.disabled = false;
    if(!ok){
      Object.assign(m, respaldo);
      btn.textContent = 'Reintentar guardado';
      return;
    }
    syncBackend('guardarMovimiento', {movimiento: m});
    wrap.remove();
    toast('Movimiento actualizado');
    onDone();
  });
}

function openMovimientoModal(main, opts={}){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  const productoPreset = opts.productoIdPreset ? findProd(opts.productoIdPreset) : null;
  wrap.innerHTML = `
    <div class="modal">
      <h3>${opts.tipoPreset==='compra' ? 'Registrar compra' : 'Registrar movimiento'}</h3>
      <p class="view-sub" style="margin:0 0 14px;">Actualiza el stock automáticamente.</p>
      <div class="field">
        <label>Tipo de movimiento</label>
        <select id="fTipo">
          <option value="venta">💵 Venta directa a cliente</option>
          <option value="revision_adicional">✏️ Revisión de diseño adicional</option>
          <option value="envio_consignacion">📦 Envío a Plastipel (consignación)</option>
          <option value="liquidacion_consignacion">✅ Liquidación de Plastipel (vendido)</option>
          <option value="devolucion_consignacion">↩️ Devolución de Plastipel</option>
          <option value="merma">⚠️ Merma / rotura / pérdida</option>
          <option value="compra">⬆️ Ingreso de stock (compra a proveedor)</option>
        </select>
      </div>
      <div class="field">
        <label id="lblProducto">Producto</label>
        <input id="fProducto" list="datalistFProducto" autocomplete="off" placeholder="Escribí para buscar (ej: Taza)…" value="${productoPreset ? escapeHtml(textoProducto(productoPreset)) : ''}">
        ${datalistProductosHTML('datalistFProducto', state.productos)}
      </div>
      <div class="field" id="proveedorField" style="display:none;"><label>Proveedor (opcional)</label><input id="fProveedor" placeholder="Ej: El Mundo del Sublimado"></div>
      <div class="breakdown-box" id="stockDisponibleBox" style="display:none;"></div>
      <div class="field" id="sobrenombreField" style="display:none;">
        <label id="lblSobrenombre">Sobrenombre / diseño (opcional)</label>
        <input id="fSobrenombre" list="sobrenombresList" placeholder="Ej: El Principito">
        <datalist id="sobrenombresList"></datalist>
        <div class="field-note" id="sobrenombreNote"></div>
      </div>
      <div class="field-row">
        <div class="field"><label id="lblCantidad">Cantidad</label><input id="fCantidad" type="number" min="1" value="1"></div>
        <div class="field"><label>Fecha</label><input id="fFecha" type="date" value="${hoyISO()}"></div>
      </div>
      <div class="field"><label id="lblPrecio">Precio unitario</label><input id="fPrecio" type="number"><div class="field-note" id="notaUltimoCosto"></div></div>
      <div class="field" id="actualizarCostoField" style="display:none;align-items:center;gap:8px;">
        <input type="checkbox" id="fActualizarCosto" checked style="width:auto;">
        <label for="fActualizarCosto" style="margin:0;">Actualizar el costo de materia prima del producto con este valor</label>
      </div>
      <div class="field"><label id="lblDetalle">Comprador / motivo (opcional)</label><input id="fDetalle" placeholder=""></div>
      <div class="hint-box" id="revisionHint" style="display:none;">✏️ Recordá: la primera revisión de cada diseño va sin cargo. Este movimiento es para la 2ª revisión en adelante.</div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  function precioSugerido(){
    const p = resolverProductoPorTexto(wrap.querySelector('#fProducto').value);
    const tipo = wrap.querySelector('#fTipo').value;
    if(tipo==='revision_adicional') return state.config.cargoRevisionAdicional;
    if(!p) return 0;
    if(tipo==='venta'||tipo==='liquidacion_consignacion') return p.precioConsignacion && tipo==='liquidacion_consignacion' ? p.precioConsignacion : p.precioVenta;
    if(tipo==='compra'){
      const ultima = ultimoCostoCompra(p.id);
      return ultima ? ultima.costo : (p.costoMateriales || p.costo);
    }
    return 0;
  }
  function actualizarSugerido(){
    const tipo = wrap.querySelector('#fTipo').value;
    wrap.querySelector('#fPrecio').value = precioSugerido();
    const lbl = wrap.querySelector('#lblDetalle');
    const det = wrap.querySelector('#fDetalle');
    if(tipo==='merma'){ lbl.textContent='Motivo de la merma'; det.placeholder='Ej: rotura en depósito'; }
    else if(tipo==='venta'){ lbl.textContent='Comprador (opcional)'; det.placeholder='Nombre / teléfono'; }
    else if(tipo==='revision_adicional'){ lbl.textContent='Detalle de la revisión (opcional)'; det.placeholder='Ej: cambio de color, ajuste de texto'; }
    else if(tipo==='compra'){ lbl.textContent='N° de remito (opcional)'; det.placeholder='Ej: 12345'; }
    else { lbl.textContent='Detalle (opcional)'; det.placeholder=''; }
    wrap.querySelector('#lblCantidad').textContent = (tipo==='revision_adicional') ? 'Cantidad de revisiones' : 'Cantidad';
    wrap.querySelector('#lblPrecio').textContent = (tipo==='revision_adicional') ? 'Cargo por revisión' : (tipo==='compra' ? 'Costo unitario' : 'Precio unitario');
    wrap.querySelector('#revisionHint').style.display = (tipo==='revision_adicional') ? 'flex' : 'none';
    wrap.querySelector('#proveedorField').style.display = (tipo==='compra') ? '' : 'none';
    wrap.querySelector('#actualizarCostoField').style.display = (tipo==='compra') ? 'flex' : 'none';
    wrap.querySelector('#fPrecio').closest('.field').style.display = (tipo==='envio_consignacion'||tipo==='devolucion_consignacion') ? 'none' : '';

    const notaUltimo = wrap.querySelector('#notaUltimoCosto');
    if(tipo==='compra'){
      const p = resolverProductoPorTexto(wrap.querySelector('#fProducto').value);
      const ultima = p ? ultimoCostoCompra(p.id) : null;
      notaUltimo.textContent = ultima ? `Precargado con el último costo de compra (${ultima.fecha}). Ajustalo si cambió.` : '';
    }else{
      notaUltimo.textContent = '';
    }

    const esConsignacion = ['envio_consignacion','liquidacion_consignacion','devolucion_consignacion'].includes(tipo);
    wrap.querySelector('#sobrenombreField').style.display = esConsignacion ? '' : 'none';

    const boxStock = wrap.querySelector('#stockDisponibleBox');
    if(tipo==='envio_consignacion'){
      const p = resolverProductoPorTexto(wrap.querySelector('#fProducto').value);
      const cantidad = Number(wrap.querySelector('#fCantidad').value)||0;
      if(p){
        const disp = stockPropio(p.id);
        const alcanza = disp >= cantidad;
        boxStock.style.display = '';
        boxStock.innerHTML = `
          <div class="breakdown-row"><span>Stock terminado disponible de "${escapeHtml(p.nombre)}"</span><b style="color:${alcanza?'var(--text)':'var(--red)'};">${disp} u.</b></div>
          <div class="breakdown-row"><span>Vas a enviar</span><b style="color:${alcanza?'var(--text)':'var(--red)'};">${cantidad} u.</b></div>
          ${!alcanza ? `<div class="breakdown-row" style="color:var(--red);"><span>⚠️ No te alcanza el stock terminado para este envío</span></div>` : ''}
        `;
      }else{
        boxStock.style.display = 'none';
      }
    }else{
      boxStock.style.display = 'none';
    }
    if(esConsignacion){
      const lblSob = wrap.querySelector('#lblSobrenombre');
      const inputSob = wrap.querySelector('#fSobrenombre');
      const nota = wrap.querySelector('#sobrenombreNote');
      const prodId = resolverProductoPorTexto(wrap.querySelector('#fProducto').value)?.id || '';
      const datalist = wrap.querySelector('#sobrenombresList');
      if(tipo==='envio_consignacion'){
        lblSob.textContent = 'Sobrenombre / diseño (opcional)';
        inputSob.placeholder = 'Ej: El Principito';
        nota.textContent = 'Así identificás en Plastipel qué personalización enviaste de este producto.';
        datalist.innerHTML = sobrenombresUsadosHistoricos().map(s=>`<option value="${escapeHtml(s)}">`).join('');
      }else{
        lblSob.textContent = tipo==='liquidacion_consignacion' ? 'Diseño vendido' : 'Diseño devuelto';
        const disponibles = sobrenombresDisponibles(prodId);
        datalist.innerHTML = disponibles.map(s=>`<option value="${escapeHtml(s.sobrenombre)}">`).join('');
        if(disponibles.length){
          inputSob.placeholder = 'Elegí uno de los enviados';
          nota.textContent = 'Diseños de este producto todavía en Plastipel: ' + disponibles.map(s=>`${escapeHtml(s.sobrenombre)} (${s.cantidad})`).join(', ') + '.';
        }else{
          inputSob.placeholder = 'Ej: El Principito';
          nota.textContent = 'No hay diseños con sobrenombre pendientes para este producto. Podés dejarlo vacío si el envío original no tenía uno.';
        }
      }
    }
  }
  wrap.querySelector('#fTipo').addEventListener('change', actualizarSugerido);
  wrap.querySelector('#fProducto').addEventListener('change', actualizarSugerido);
  wrap.querySelector('#fProducto').addEventListener('input', actualizarSugerido);
  wrap.querySelector('#fCantidad').addEventListener('input', actualizarSugerido);
  if(opts.tipoPreset) wrap.querySelector('#fTipo').value = opts.tipoPreset;
  actualizarSugerido();

  wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
  // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.

  wrap.querySelector('#saveBtn').addEventListener('click', async ()=>{
    const tipo = wrap.querySelector('#fTipo').value;
    const prodId = resolverProductoPorTexto(wrap.querySelector('#fProducto').value)?.id;
    const p = findProd(prodId);
    const cantidad = Number(wrap.querySelector('#fCantidad').value)||0;
    if(!p){ toast('Elegí un producto de la lista (tocá una de las opciones sugeridas al escribir)'); return; }
    if(cantidad<=0){ toast('Ingresá una cantidad válida'); return; }
    const precioUnit = Number(wrap.querySelector('#fPrecio').value)||0;
    const total = (tipo==='envio_consignacion'||tipo==='devolucion_consignacion') ? 0 : precioUnit*cantidad;
    const actualizarCosto = tipo==='compra' && wrap.querySelector('#fActualizarCosto').checked;
    const esConsignacion = ['envio_consignacion','liquidacion_consignacion','devolucion_consignacion'].includes(tipo);
    const sobrenombre = esConsignacion ? wrap.querySelector('#fSobrenombre').value.trim() : '';

    if(!wrap._registrado){
      if((tipo==='venta'||tipo==='envio_consignacion'||tipo==='merma') && stockPropio(prodId) < cantidad){
        toast(`⛔ No alcanza el stock de "${p.nombre}" (disponible: ${stockPropio(prodId)}). Registrá primero el ingreso que falta.`);
        return;
      }
      if((tipo==='liquidacion_consignacion'||tipo==='devolucion_consignacion') && sobrenombre){
        const alias = stockEnConsignacionDetallado().find(x=>x.productoId===prodId && x.sobrenombre===sobrenombre);
        const dispAlias = alias ? alias.cantidad : 0;
        if(dispAlias < cantidad){
          toast(`⛔ Para el diseño "${sobrenombre}" solo figuran ${dispAlias} unidades enviadas a Plastipel.`);
          return;
        }
      }else if(tipo==='liquidacion_consignacion' && stockEnConsignacion(prodId) < cantidad){
        toast(`⛔ Solo figuran ${stockEnConsignacion(prodId)} unidades enviadas a Plastipel de este producto.`);
        return;
      }
      let proveedor = '';
      let detalleFinal = wrap.querySelector('#fDetalle').value.trim();
      if(tipo==='compra'){
        proveedor = wrap.querySelector('#fProveedor').value.trim();
        const remito = detalleFinal;
        const partes = [];
        if(proveedor) partes.push(`Proveedor: ${proveedor}`);
        if(remito) partes.push(`Remito ${remito}`);
        detalleFinal = partes.join(' · ');
      }
      const nuevoMov = {
        id: uid('m'),
        tipo, productoId: prodId, productoNombre: p.nombre,
        cantidad, precioUnitario: precioUnit, total,
        fecha: wrap.querySelector('#fFecha').value || hoyISO(),
        detalle: detalleFinal,
        proveedor: proveedor || null,
        sobrenombre: sobrenombre || null,
        consignatario: (tipo.includes('consignacion')) ? CONSIGNATARIO : null,
      };
      state.movimientos.push(nuevoMov);
      syncBackend('guardarMovimiento', {movimiento: nuevoMov});
      if(actualizarCosto){
        p.costoMateriales = precioUnit;
        await aplicarCosteoAbsorcion(p);
      }
      wrap._registrado = true;
    }
    const btn = wrap.querySelector('#saveBtn');
    btn.textContent = 'Guardando…'; btn.disabled = true;
    const okMov = await saveMovimientos();
    const okProd = actualizarCosto ? await saveProductos() : true;
    btn.disabled = false;
    if(!okMov || !okProd){ btn.textContent = 'Reintentar guardado'; return; }
    wrap.remove();
    toast(tipo==='compra' ? 'Compra registrada' : 'Movimiento registrado');
    render();
  });
}

async function renderConsignacion(main){
  const conStockDetalle = stockEnConsignacionDetallado();

  const enviosTotal = state.movimientos.filter(m=>m.tipo==='envio_consignacion').reduce((a,m)=>a+m.cantidad,0);
  const liquidTotal = state.movimientos.filter(m=>m.tipo==='liquidacion_consignacion').reduce((a,m)=>a+m.cantidad,0);
  const ingresoPlastipelTotal = state.movimientos.filter(m=>m.tipo==='liquidacion_consignacion').reduce((a,m)=>a+m.total,0);

  const periodo = state.periodoFiltro;
  const liquidacionesPeriodo = movimientosDePeriodo(periodo).filter(m=>m.tipo==='liquidacion_consignacion');
  const totalPeriodo = liquidacionesPeriodo.reduce((a,m)=>a+m.total,0);

  main.innerHTML = `
    <div class="topbar">
      <div>
        <h1 class="view-title">Consignación — Plastipel</h1>
        <p class="view-sub">Mercadería entregada a la artística, pendiente de liquidación mensual</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline" id="btnEnvioMasivoPlastipelDesdeVista">📦 Envío masivo</button>

      </div>
    </div>
    <div class="grad-bar"></div>

    <div class="hint-box">💡 El stock sale de tu inventario cuando lo <b>envías</b> a Plastipel. El ingreso se registra recién cuando ella te <b>liquida</b> lo vendido, a fin de mes. Si le pusiste un sobrenombre al enviarlo (ej: "El Principito"), lo vas a ver identificado acá abajo.</div>

    <div class="kpi-grid">
      <div class="card kpi" style="--accent:var(--teal)"><div class="kpi-label">Unidades enviadas (histórico)</div><div class="kpi-value">${enviosTotal}</div></div>
      <div class="card kpi" style="--accent:var(--green)"><div class="kpi-label">Unidades liquidadas (histórico)</div><div class="kpi-value">${liquidTotal}</div></div>
      <div class="card kpi" style="--accent:var(--cyan)"><div class="kpi-label">Cobrado histórico de Plastipel</div><div class="kpi-value">${money(ingresoPlastipelTotal)}</div></div>
    </div>

    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">

      ${conStockDetalle.length ? '<button class="btn btn-teal btn-sm" id="btnLiquidacionMasiva">✅ Liquidar seleccionados</button>' : ''}
    </div>
    <div class="table-wrap" style="margin-bottom:24px;">
      <table>
        <thead><tr><th>Producto</th><th>Diseño / sobrenombre</th><th>Unidades</th><th>Valor a precio Plastipel</th></tr></thead>
        <tbody>
          ${conStockDetalle.length ? conStockDetalle.map(x=>{
            const p = findProd(x.productoId);
            return `
            <tr>
              <td class="prod-name">${escapeHtml(x.productoNombre)}</td>
              <td>${x.sobrenombre ? `<span class="badge badge-teal">${escapeHtml(x.sobrenombre)}</span>` : '<span style="color:var(--ink-faint);">— sin identificar —</span>'}</td>
              <td class="mono">${x.cantidad}</td>
              <td class="mono">${money(x.cantidad * (p?p.precioConsignacion:0))}</td>
            </tr>`;
          }).join('') : `<tr><td colspan="4" class="empty">No hay stock pendiente en Plastipel.</td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="section-title">Liquidaciones por mes</div>
    <div class="filter-bar">
      <select id="periodoSel">${opcionesPeriodo(periodo)}</select>
      <span style="font-size:13px;color:var(--ink-soft);">Total liquidado en ${nombreMes(periodo)}: <b>${money(totalPeriodo)}</b></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Fecha</th><th>Producto</th><th>Diseño</th><th>Cant.</th><th>Total</th></tr></thead>
        <tbody>
          ${liquidacionesPeriodo.length ? liquidacionesPeriodo.map(m=>`
            <tr><td class="mono">${m.fecha}</td><td>${escapeHtml(m.productoNombre)}</td><td>${m.sobrenombre?escapeHtml(m.sobrenombre):'—'}</td><td class="mono">${m.cantidad}</td><td class="mono">${money(m.total)}</td></tr>
          `).join('') : `<tr><td colspan="5" class="empty">Sin liquidaciones en este mes.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('btnLiquidar').addEventListener('click', ()=>openLiquidacionModal(main));
  document.getElementById('btnEnvioMasivoPlastipelDesdeVista').addEventListener('click', ()=>openEnvioMasivoModal(main));
  const btnLiqMasiva = document.getElementById('btnLiquidacionMasiva');
  if(btnLiqMasiva) btnLiqMasiva.addEventListener('click', ()=>openLiquidacionMasivaModal(main));
  document.getElementById('periodoSel').addEventListener('change',(e)=>{ state.periodoFiltro = e.target.value; renderConsignacion(main); });
}

function opcionesPeriodo(sel){
  const periodos = new Set([mesActualISO()]);
  state.movimientos.forEach(m=>{ if(m.fecha) periodos.add(m.fecha.slice(0,7)); });
  return [...periodos].sort().reverse().map(p=>`<option value="${p}" ${p===sel?'selected':''}>${nombreMes(p)}</option>`).join('');
}

let envioMasivoFiltroTexto = '';

function openEnvioMasivoModal(main){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  const disponibles = state.productos.filter(p=>p.categoria==='producto_terminado' && stockPropio(p.id)>0);

  if(!disponibles.length){
    wrap.innerHTML = `
      <div class="modal">
        <h3>📦 Envío masivo a Plastipel</h3>
        <p class="view-sub" style="margin:0 0 14px;">No tenés stock de ningún producto terminado en este momento.</p>
        <div class="hint-box">💡 Sublimá algún producto o registrá una venta/stock inicial para tener unidades disponibles antes de enviar a Plastipel.</div>
        <div class="modal-actions"><button class="btn btn-primary" id="cancelBtn">Entendido</button></div>
      </div>
    `;
    document.body.appendChild(wrap);
    wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
    // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.
    return;
  }

  wrap.innerHTML = `
    <div class="modal" style="max-width:760px;">
      <h3>📦 Envío masivo a Plastipel</h3>
      <p class="view-sub" style="margin:0 0 14px;">Tildá todo lo que vas a entregar — se descuenta de tu stock terminado y queda registrado como enviado en consignación.</p>

      <input type="text" id="buscarEnvioMasivo" autocomplete="off" placeholder="Buscar producto…" value="${escapeHtml(envioMasivoFiltroTexto)}" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:#1A1811;color:var(--text);margin-bottom:12px;">

      <div style="max-height:42vh;overflow-y:auto;border:1px solid var(--border);border-radius:10px;">
        <table style="width:100%;">
          <thead><tr>
            <th style="width:30px;"><input type="checkbox" id="chkTodosEnvio"></th>
            <th>Producto</th><th>Stock disp.</th><th>Cantidad a enviar</th><th>Sobrenombre / diseño</th>
          </tr></thead>
          <tbody id="filasEnvioMasivo"></tbody>
        </table>
      </div>

      <div class="field" style="margin-top:14px;"><label>Fecha del envío</label><input id="fFechaEnvioMasivo" type="date" value="${hoyISO()}"></div>

      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">Cancelar</button>
        <button class="btn btn-teal" id="saveBtn">Registrar envío</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  let valores = {}; // productoId -> {checked, cantidad, sobrenombre}

  function listaFiltrada(){
    const term = envioMasivoFiltroTexto.trim().toLowerCase();
    return disponibles.filter(p => !term || p.nombre.toLowerCase().includes(term));
  }

  function pintarFilas(){
    const tbody = wrap.querySelector('#filasEnvioMasivo');
    const lista = listaFiltrada();
    tbody.innerHTML = lista.map(p=>{
      const disp = stockPropio(p.id);
      const v = valores[p.id] || {checked:false, cantidad:disp, sobrenombre:''};
      return `
        <tr data-prod="${p.id}">
          <td><input type="checkbox" class="fila-check" ${v.checked?'checked':''}></td>
          <td>
            <div class="prod-name">${escapeHtml(p.nombre)}</div>
            <div class="prod-code mono">${escapeHtml(p.codigoInterno||'—')}</div>
          </td>
          <td class="mono">${disp}</td>
          <td><input type="number" class="fila-cantidad mono" min="1" max="${disp}" value="${v.cantidad}" style="width:90px;"></td>
          <td><input type="text" class="fila-sobrenombre" placeholder="Ej: El Principito" value="${escapeHtml(v.sobrenombre)}" style="width:160px;"></td>
        </tr>`;
    }).join('') || `<tr><td colspan="5" class="empty">No se encontraron productos.</td></tr>`;

    tbody.querySelectorAll('[data-prod]').forEach(tr=>{
      const prodId = tr.dataset.prod;
      const chk = tr.querySelector('.fila-check');
      const inputCant = tr.querySelector('.fila-cantidad');
      const inputSob = tr.querySelector('.fila-sobrenombre');
      chk.addEventListener('change', ()=>{
        const actual = valores[prodId] || {cantidad: Number(inputCant.value)||0, sobrenombre: inputSob.value};
        valores[prodId] = {...actual, checked: chk.checked};
      });
      inputCant.addEventListener('input', ()=>{
        valores[prodId] = {checked:true, cantidad: Number(inputCant.value)||0, sobrenombre: valores[prodId]?.sobrenombre || inputSob.value};
        chk.checked = true;
      });
      inputSob.addEventListener('input', ()=>{
        valores[prodId] = {checked: valores[prodId]?.checked ?? chk.checked, cantidad: valores[prodId]?.cantidad ?? (Number(inputCant.value)||0), sobrenombre: inputSob.value};
      });
    });
  }
  pintarFilas();

  wrap.querySelector('#buscarEnvioMasivo').addEventListener('input', (e)=>{
    envioMasivoFiltroTexto = e.target.value;
    pintarFilas();
  });
  wrap.querySelector('#chkTodosEnvio').addEventListener('change', (e)=>{
    listaFiltrada().forEach(p=>{
      const disp = stockPropio(p.id);
      const actual = valores[p.id] || {cantidad: disp, sobrenombre:''};
      valores[p.id] = {...actual, checked: e.target.checked};
    });
    pintarFilas();
  });

  wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
  // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.

  wrap.querySelector('#saveBtn').addEventListener('click', async ()=>{
    const aEnviar = Object.entries(valores).filter(([id,v])=> v.checked && v.cantidad>0);
    if(!aEnviar.length){ toast('Tildá al menos un producto con cantidad'); return; }

    const excedidos = aEnviar.filter(([id,v]) => v.cantidad > stockPropio(id));
    if(excedidos.length){
      const nombres = excedidos.map(([id])=>findProd(id)?.nombre || id).join(', ');
      toast(`⛔ Estos productos no tienen stock suficiente: ${nombres}. Corregí la cantidad antes de enviar.`);
      return;
    }

    if(!wrap._registrado){
      const fecha = wrap.querySelector('#fFechaEnvioMasivo').value || hoyISO();
      for(const [prodId, v] of aEnviar){
        const p = findProd(prodId);
        if(!p) continue;
        const mov = {
          id: uid('m'), tipo:'envio_consignacion', productoId: p.id, productoNombre: p.nombre,
          cantidad: v.cantidad, precioUnitario: 0, total: 0, fecha,
          detalle: 'Envío masivo', sobrenombre: v.sobrenombre.trim() || null, consignatario: CONSIGNATARIO,
        };
        state.movimientos.push(mov);
        syncBackend('guardarMovimiento', {movimiento: mov});
      }
      wrap._registrado = true;
    }
    const btn = wrap.querySelector('#saveBtn');
    btn.textContent = 'Guardando…'; btn.disabled = true;
    const ok = await saveMovimientos();
    btn.disabled = false;
    if(!ok){ btn.textContent = 'Reintentar guardado'; return; }
    wrap.remove();
    toast(`Envío registrado: ${aEnviar.length} producto${aEnviar.length===1?'':'s'}`);
    render();
  });
}

function openCompraMasivaModal(main){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `
    <div class="modal" style="max-width:640px;">
      <h3>📋 Compra por planilla</h3>
      <p class="view-sub" style="margin:0 0 14px;">Cargá de una vez varios productos de la misma compra — podés mezclar productos que ya tenés con productos nuevos.</p>
      <div class="field-row">
        <div class="field"><label>Proveedor (opcional)</label><input id="fProveedorMasivo" placeholder="Ej: El Mundo del Sublimado"></div>
        <div class="field"><label>N° de remito (opcional)</label><input id="fRemitoMasivo" placeholder="Ej: 12345"></div>
      </div>
      <div class="field"><label>Fecha</label><input id="fFechaMasiva" type="date" value="${hoyISO()}"></div>
      <div class="field" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="fActualizarCostoMasivo" checked style="width:auto;">
        <label for="fActualizarCostoMasivo" style="margin:0;">Actualizar el costo de cada producto con lo cargado acá</label>
      </div>
      <div style="height:1px;background:var(--border);margin:14px 0;"></div>
      <div id="filasCompra"></div>
      ${datalistProductosHTML('datalistCompraMasiva', state.productos)}
      <button type="button" class="btn btn-outline btn-sm" id="btnAgregarFila" style="margin-top:4px;">+ Agregar producto</button>
      <div class="breakdown-box" id="totalCompraBox" style="margin-top:14px;"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Registrar compra</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  let filas = [{tipo:'existente', productoId: '', nombreNuevo:'', categoriaNueva:'materia_prima', cantidad:1, costo:0}];

  function filaHTML(f, i){
    const opcionesProductos = state.productos.map(p=>`<option value="${p.id}" ${f.productoId===p.id?'selected':''}>${escapeHtml(p.codigoInterno||'')} — ${escapeHtml(p.nombre)}</option>`).join('');
    const productoActual = f.productoId ? findProd(f.productoId) : null;
    const ultima = productoActual ? ultimoCostoCompra(productoActual.id) : null;
    const indiceEnLote = filas.slice(0, i).filter(x=>x.tipo==='nuevo').length;
    const codigoPrevisto = previsualizarCodigoInterno(indiceEnLote);
    return `
    <div class="field-row" data-fila="${i}" style="align-items:flex-end;margin-bottom:8px;background:var(--card-hover);padding:10px;border-radius:8px;">
      <div style="flex:2;min-width:0;">
        <select class="fila-tipo" style="margin-bottom:6px;width:100%;">
          <option value="existente" ${f.tipo==='existente'?'selected':''}>Producto existente</option>
          <option value="nuevo" ${f.tipo==='nuevo'?'selected':''}>+ Producto nuevo</option>
        </select>
        ${f.tipo==='existente'
          ? `<input class="fila-producto" list="datalistCompraMasiva" autocomplete="off" placeholder="Escribí para buscar (ej: Taza)…" value="${productoActual ? escapeHtml(textoProducto(productoActual)) : ''}" style="width:100%;">`
          : `<div class="field-note" style="margin:0 0 4px;">Va a quedar como <b class="mono" style="color:var(--ink);">${codigoPrevisto}</b></div>
             <input class="fila-nombre-nuevo" placeholder="Nombre del producto nuevo" value="${escapeHtml(f.nombreNuevo||'')}" style="width:100%;margin-bottom:6px;">
             <select class="fila-categoria-nueva" style="width:100%;">
               <option value="materia_prima" ${f.categoriaNueva==='materia_prima'?'selected':''}>🧱 Materia prima</option>
               <option value="insumo" ${f.categoriaNueva==='insumo'?'selected':''}>🎨 Insumo</option>
               <option value="producto_terminado" ${f.categoriaNueva==='producto_terminado'?'selected':''}>🏷️ Producto terminado</option>
             </select>`
        }
      </div>
      <div style="width:80px;flex-shrink:0;">
        <label style="font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;">Cantidad</label>
        <input class="fila-cantidad" type="number" value="${f.cantidad}" style="width:100%;">
      </div>
      <div style="width:110px;flex-shrink:0;">
        <label style="font-size:11px;color:var(--ink-soft);display:block;margin-bottom:4px;">Costo unit.</label>
        <input class="fila-costo" type="number" value="${f.costo}" style="width:100%;">
        ${ultima ? `<div class="field-note" style="margin:3px 0 0;white-space:nowrap;">Último: ${money(ultima.costo)}<br>${ultima.fecha}</div>` : ''}
      </div>
      <button type="button" class="btn-icon fila-quitar" title="Quitar" style="flex-shrink:0;">✕</button>
    </div>`;
  }

  function leerFilasDelDOM(){
    filas = [...wrap.querySelectorAll('#filasCompra [data-fila]')].map((el,i)=>{
      const anterior = filas[i] || {};
      const tipo = el.querySelector('.fila-tipo').value;
      const cantidad = Number(el.querySelector('.fila-cantidad').value)||0;
      const costo = Number(el.querySelector('.fila-costo').value)||0;
      const prodEl = el.querySelector('.fila-producto');
      const nombreEl = el.querySelector('.fila-nombre-nuevo');
      const catEl = el.querySelector('.fila-categoria-nueva');
      return {
        tipo,
        productoId: prodEl ? (resolverProductoPorTexto(prodEl.value)?.id || '') : (anterior.productoId || ''),
        nombreNuevo: nombreEl ? nombreEl.value : (anterior.nombreNuevo || ''),
        categoriaNueva: catEl ? catEl.value : (anterior.categoriaNueva || 'materia_prima'),
        cantidad, costo,
      };
    });
  }

  function pintarFilas(){
    const cont = wrap.querySelector('#filasCompra');
    cont.innerHTML = filas.map((f,i)=>filaHTML(f,i)).join('');
    cont.querySelectorAll('.fila-quitar').forEach(b=>{
      b.addEventListener('click', ()=>{
        leerFilasDelDOM();
        const idx = Number(b.closest('[data-fila]').dataset.fila);
        filas.splice(idx,1);
        if(!filas.length) filas.push({tipo:'existente', productoId: '', nombreNuevo:'', categoriaNueva:'materia_prima', cantidad:1, costo:0});
        pintarFilas();
      });
    });
    cont.querySelectorAll('.fila-tipo').forEach(sel=>{
      sel.addEventListener('change', ()=>{ leerFilasDelDOM(); pintarFilas(); });
    });
    cont.querySelectorAll('input, select').forEach(el=>{
      el.addEventListener('input', actualizarTotal);
    });
    cont.querySelectorAll('.fila-producto').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const p = resolverProductoPorTexto(inp.value);
        if(p){
          leerFilasDelDOM();
          const idx = Number(inp.closest('[data-fila]').dataset.fila);
          const ultima = ultimoCostoCompra(p.id);
          if(ultima) filas[idx].costo = ultima.costo;
          pintarFilas();
        }
      });
    });
    actualizarTotal();
  }

  function actualizarTotal(){
    leerFilasDelDOM();
    let total = 0, cantidadItems = 0;
    filas.forEach(f=>{ total += f.cantidad*f.costo; cantidadItems += f.cantidad>0?1:0; });
    wrap.querySelector('#totalCompraBox').innerHTML = `
      <div class="breakdown-row total"><span>${filas.length} producto${filas.length===1?'':'s'} en esta compra</span><span>${money(total)}</span></div>
    `;
  }

  pintarFilas();
  wrap.querySelector('#btnAgregarFila').addEventListener('click', ()=>{
    leerFilasDelDOM();
    filas.push({tipo:'existente', productoId: '', nombreNuevo:'', categoriaNueva:'materia_prima', cantidad:1, costo:0});
    pintarFilas();
  });

  wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
  // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.

  wrap.querySelector('#saveBtn').addEventListener('click', async ()=>{
    leerFilasDelDOM();
    const validas = filas.filter(f => f.cantidad>0 && (f.tipo==='existente' ? f.productoId : f.nombreNuevo.trim()));
    if(!validas.length){ toast('Cargá al menos un producto con cantidad'); return; }

    const proveedor = wrap.querySelector('#fProveedorMasivo').value.trim();
    const remito = wrap.querySelector('#fRemitoMasivo').value.trim();
    const fecha = wrap.querySelector('#fFechaMasiva').value || hoyISO();
    const actualizarCosto = wrap.querySelector('#fActualizarCostoMasivo').checked;
    const partesDetalle = [];
    if(proveedor) partesDetalle.push(`Proveedor: ${proveedor}`);
    if(remito) partesDetalle.push(`Remito ${remito}`);
    const detalle = partesDetalle.join(' · ');

    if(!wrap._registrado){
      for(const f of validas){
        let producto;
        if(f.tipo==='nuevo'){
          producto = {
            id: uid('p'),
            codigoInterno: generarCodigoInterno(),
            codigo: '',
            nombre: f.nombreNuevo.trim(),
            categoria: f.categoriaNueva,
            materiaPrimaId: null,
            costo: f.costo,
            costoAnterior: null,
            fechaCambioCosto: null,
            costoMateriales: f.costo,
            horasDiseno: 0,
            tarifaHoraOverride: null,
            costoProcesoPctOverride: null,
            gastosIndirectosPctOverride: null,
            precioVenta: 0,
            precioConsignacion: 0,
            stock: 0,
            tieneImagen: false,
          };
          if(f.categoriaNueva==='producto_terminado') producto.costo = Math.round(costeoAbsorcion(producto).total);
          state.productos.push(producto);
        }else{
          producto = findProd(f.productoId);
          if(actualizarCosto && producto){
            if(producto.categoria==='materia_prima' || producto.categoria==='insumo'){
              if(f.costo !== producto.costo){
                producto.costoAnterior = producto.costo;
                producto.fechaCambioCosto = hoyISO();
                producto.costo = f.costo;
              }
              producto.costoMateriales = f.costo;
            }else{
              producto.costoMateriales = f.costo;
              await aplicarCosteoAbsorcion(producto);
            }
          }
        }
        const mov = {
          id: uid('m'), tipo:'compra', productoId: producto.id, productoNombre: producto.nombre,
          cantidad: f.cantidad, precioUnitario: f.costo, total: f.cantidad*f.costo,
          fecha, detalle, proveedor: proveedor || null, loteId: null,
        };
        state.movimientos.push(mov);
        syncBackend('guardarMovimiento', {movimiento: mov});
      }
      wrap._registrado = true;
    }

    const btn = wrap.querySelector('#saveBtn');
    btn.textContent = 'Guardando…'; btn.disabled = true;
    const ok1 = await saveProductos();
    const ok2 = await saveMovimientos();
    btn.disabled = false;
    if(!ok1 || !ok2){ btn.textContent = 'Reintentar guardado'; return; }
    wrap.remove();
    toast(`Compra registrada: ${validas.length} producto${validas.length===1?'':'s'}`);
    render();
  });
}

let costosMasivoFiltroCat = 'todos';
let costosMasivoFiltroTexto = '';

let reclasificarFiltroCat = 'todos';
let reclasificarFiltroTexto = '';

function openReclasificarModal(main){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `

        <button class="chip ${reclasificarFiltroCat==='insumo'?'active':''}" data-cat="insumo">🎨 Insumos</button>
      </div>
      <input type="text" id="buscarReclasificar" autocomplete="off" placeholder="Buscar producto…" value="${escapeHtml(reclasificarFiltroTexto)}" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:#1A1811;color:var(--text);margin-bottom:12px;">

      <div style="max-height:42vh;overflow-y:auto;border:1px solid var(--border);border-radius:10px;">
        <table style="width:100%;">
          <thead><tr>
            <th style="width:30px;"><input type="checkbox" id="chkTodosReclasificar"></th>
            <th>Producto</th><th>Categoría actual</th>
          </tr></thead>
          <tbody id="filasReclasificar"></tbody>
        </table>
      </div>

      <div style="height:1px;background:var(--border);margin:14px 0;"></div>

      <div class="field">
        <label>Cambiar los tildados a</label>
        <select id="fCategoriaDestino">
          <option value="materia_prima">🧱 Materia prima (superficie sin sublimar)</option>
          <option value="insumo">🎨 Insumo (tinta, vinilo, etc.)</option>
          <option value="producto_terminado">🏷️ Producto terminado (para vender)</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Aplicar a los tildados</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  let seleccionados = new Set();

  function listaFiltrada(){
    const term = reclasificarFiltroTexto.trim().toLowerCase();
    return state.productos.filter(p =>
      (reclasificarFiltroCat==='todos' || (p.categoria||'producto_terminado')===reclasificarFiltroCat) &&
      (!term || p.nombre.toLowerCase().includes(term))
    );
  }

  function pintarFilas(){
    const tbody = wrap.querySelector('#filasReclasificar');
    const lista = listaFiltrada();
    tbody.innerHTML = lista.map(p=>`
      <tr data-prod="${p.id}">
        <td><input type="checkbox" class="fila-check" ${seleccionados.has(p.id)?'checked':''}></td>
        <td>
          <div class="prod-name">${escapeHtml(p.nombre)}</div>
          <div class="prod-code mono">${escapeHtml(p.codigoInterno||'—')}</div>
        </td>
        <td>${categoriaBadge(p.categoria)}</td>
      </tr>
    `).join('') || `<tr><td colspan="3" class="empty">No se encontraron productos.</td></tr>`;

    tbody.querySelectorAll('[data-prod]').forEach(tr=>{
      const prodId = tr.dataset.prod;
      tr.querySelector('.fila-check').addEventListener('change', (e)=>{
        if(e.target.checked) seleccionados.add(prodId); else seleccionados.delete(prodId);
      });
    });
    // evitar que el botón de "cambiar categoría" adentro del badge abra el otro modal acá
    tbody.querySelectorAll('[data-cambiar-categoria]').forEach(b=>{ b.disabled = true; b.style.pointerEvents='none'; b.style.opacity='.6'; });
  }
  pintarFilas();

  wrap.querySelector('#buscarReclasificar').addEventListener('input',(e)=>{ reclasificarFiltroTexto = e.target.value; pintarFilas(); });
  wrap.querySelectorAll('#chipsReclasificar [data-cat]').forEach(b=>{
    b.addEventListener('click', ()=>{
      reclasificarFiltroCat = b.dataset.cat;
      wrap.querySelectorAll('#chipsReclasificar [data-cat]').forEach(x=>x.classList.toggle('active', x===b));
      pintarFilas();
    });
  });
  wrap.querySelector('#chkTodosReclasificar').addEventListener('change', (e)=>{
    listaFiltrada().forEach(p=>{ if(e.target.checked) seleccionados.add(p.id); else seleccionados.delete(p.id); });
    pintarFilas();
  });

  wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
  // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.

  wrap.querySelector('#saveBtn').addEventListener('click', async ()=>{
    if(!seleccionados.size){ toast('Tildá al menos un producto'); return; }
    const destino = wrap.querySelector('#fCategoriaDestino').value;
    for(const id of seleccionados){
      const p = findProd(id);
      if(!p) continue;
      p.categoria = destino;
      if(destino !== 'producto_terminado') p.materiaPrimaId = null;
      await aplicarCosteoAbsorcion(p);
    }
    const btn = wrap.querySelector('#saveBtn');
    btn.textContent = 'Guardando…'; btn.disabled = true;
    const ok = await saveProductos();
    btn.disabled = false;
    if(!ok){ btn.textContent = 'Reintentar guardado'; return; }
    wrap.remove();
    toast(`Reclasificados: ${seleccionados.size} producto${seleccionados.size===1?'':'s'}`);
    render();
  });
}

function openActualizarCostosModal(main){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `
    <div class="modal" style="max-width:760px;">
      <h3>💲 Actualización masiva de costos</h3>
      <p class="view-sub" style="margin:0 0 14px;">Cargá el nuevo costo de cada producto y aplicalos todos juntos.</p>

      <div class="chip-row" id="chipsCostosMasivo" style="margin-bottom:8px;">
        <button class="chip ${costosMasivoFiltroCat==='todos'?'active':''}" data-cat="todos">Todos</button>
        <button class="chip ${costosMasivoFiltroCat==='materia_prima'?'active':''}" data-cat="materia_prima">🧱 Materia prima</button>
        <button class="chip ${costosMasivoFiltroCat==='insumo'?'active':''}" data-cat="insumo">🎨 Insumos</button>
        <button class="chip ${costosMasivoFiltroCat==='producto_terminado'?'active':''}" data-cat="producto_terminado">🏷️ Terminados</button>
      </div>
      <div class="field-row" style="align-items:center;">
        <input type="text" id="buscarCostosMasivo" autocomplete="off" placeholder="Buscar producto…" value="${escapeHtml(costosMasivoFiltroTexto)}" style="flex:2;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:#1A1811;color:var(--text);">
        <button type="button" class="btn btn-outline btn-sm" id="btnUsarUltimoTodos" style="flex-shrink:0;">Usar último costo de compra en todos</button>
      </div>

      <div style="height:1px;background:var(--border);margin:12px 0;"></div>

      <div style="max-height:46vh;overflow-y:auto;border:1px solid var(--border);border-radius:10px;">
        <table style="width:100%;">
          <thead><tr>
            <th style="width:30px;"><input type="checkbox" id="chkTodos"></th>
            <th>Producto</th><th>Costo actual</th><th>Última compra</th><th>Nuevo costo</th>
          </tr></thead>
          <tbody id="filasCostosMasivo"></tbody>
        </table>
      </div>

      <div class="field-note" style="margin-top:8px;">Se aplica solo a las filas tildadas que tengan un nuevo costo cargado.</div>

      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Aplicar cambios</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  let valores = {}; // productoId -> {checked, nuevoCosto}

  function listaFiltrada(){
    const term = costosMasivoFiltroTexto.trim().toLowerCase();
    return state.productos.filter(p =>
      (costosMasivoFiltroCat==='todos' || (p.categoria||'producto_terminado')===costosMasivoFiltroCat) &&
      (!term || p.nombre.toLowerCase().includes(term))
    );
  }

  function pintarFilas(){
    const tbody = wrap.querySelector('#filasCostosMasivo');
    const lista = listaFiltrada();
    tbody.innerHTML = lista.map(p=>{
      const ultima = ultimoCostoCompra(p.id);
      const v = valores[p.id] || {checked:false, nuevoCosto:''};
      const usaReceta = p.categoria==='producto_terminado' && !!p.materiaPrimaId;
      return `
        <tr data-prod="${p.id}">
          <td><input type="checkbox" class="fila-check" ${v.checked?'checked':''} ${usaReceta?'disabled':''}></td>
          <td>
            <div class="prod-name">${escapeHtml(p.nombre)}</div>
            <div class="prod-code mono">${escapeHtml(p.codigoInterno||'—')} ${categoriaBadge(p.categoria)}</div>
          </td>
          <td class="mono">${money(p.costo)}</td>
          <td>${ultima ? `<button type="button" class="link-btn fila-usar-ultimo" ${usaReceta?'disabled':''}>${money(ultima.costo)}<br><span style="font-size:10px;color:var(--ink-faint);">${ultima.fecha}</span></button>` : '<span style="color:var(--ink-faint);">—</span>'}</td>
          <td>${usaReceta
            ? '<span class="field-note" style="margin:0;">usa receta ↴</span>'
            : `<input type="number" class="fila-nuevo-costo mono" value="${v.nuevoCosto}" style="width:100px;" placeholder="${p.costo}">`}</td>
        </tr>`;
    }).join('') || `<tr><td colspan="5" class="empty">No se encontraron productos.</td></tr>`;

    tbody.querySelectorAll('[data-prod]').forEach(tr=>{
      const prodId = tr.dataset.prod;
      const chk = tr.querySelector('.fila-check');
      const inputCosto = tr.querySelector('.fila-nuevo-costo');
      const btnUltimo = tr.querySelector('.fila-usar-ultimo');
      chk.addEventListener('change', ()=>{
        valores[prodId] = {...(valores[prodId]||{}), checked: chk.checked, nuevoCosto: valores[prodId]?.nuevoCosto || ''};
      });
      if(inputCosto){
        inputCosto.addEventListener('input', ()=>{
          valores[prodId] = {checked: true, nuevoCosto: inputCosto.value};
          chk.checked = true;
        });
      }
      if(btnUltimo && !btnUltimo.disabled){
        btnUltimo.addEventListener('click', ()=>{
          const ultima = ultimoCostoCompra(prodId);
          if(!ultima) return;
          valores[prodId] = {checked:true, nuevoCosto: String(ultima.costo)};
          pintarFilas();
        });
      }
    });
  }
  pintarFilas();

  wrap.querySelector('#buscarCostosMasivo').addEventListener('input', (e)=>{
    costosMasivoFiltroTexto = e.target.value;
    pintarFilas();
  });
  wrap.querySelectorAll('#chipsCostosMasivo [data-cat]').forEach(b=>{
    b.addEventListener('click', ()=>{
      costosMasivoFiltroCat = b.dataset.cat;
      wrap.querySelectorAll('#chipsCostosMasivo [data-cat]').forEach(x=>x.classList.toggle('active', x===b));
      pintarFilas();
    });
  });
  wrap.querySelector('#btnUsarUltimoTodos').addEventListener('click', ()=>{
    listaFiltrada().forEach(p=>{
      const ultima = ultimoCostoCompra(p.id);
      if(ultima) valores[p.id] = {checked:true, nuevoCosto: String(ultima.costo)};
    });
    pintarFilas();
    toast('Se cargó el último costo de compra en los productos visibles');
  });
  wrap.querySelector('#chkTodos').addEventListener('change', (e)=>{
    listaFiltrada().forEach(p=>{
      const actual = valores[p.id] || {nuevoCosto:''};
      valores[p.id] = {checked: e.target.checked, nuevoCosto: actual.nuevoCosto};
    });
    pintarFilas();
  });

  wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
  // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.

  wrap.querySelector('#saveBtn').addEventListener('click', async ()=>{
    const aAplicar = Object.entries(valores).filter(([id,v])=> v.checked && v.nuevoCosto!=='' && !isNaN(Number(v.nuevoCosto)));
    if(!aAplicar.length){ toast('Tildá al menos un producto con un nuevo costo cargado'); return; }

    let cambiados = 0;
    for(const [prodId, v] of aAplicar){
      const p = findProd(prodId);
      if(!p) continue;
      const nuevo = Number(v.nuevoCosto);
      if(nuevo === p.costo) continue;
      p.costoAnterior = p.costo;
      p.fechaCambioCosto = hoyISO();
      if(p.categoria==='materia_prima' || p.categoria==='insumo'){
        p.costo = nuevo;
        p.costoMateriales = nuevo;
      }else{
        p.costoMateriales = nuevo;
        await aplicarCosteoAbsorcion(p);
      }
      cambiados++;
    }
    const btn = wrap.querySelector('#saveBtn');
    btn.textContent = 'Guardando…'; btn.disabled = true;
    const ok = await saveProductos();
    btn.disabled = false;
    if(!ok){ btn.textContent = 'Reintentar guardado'; return; }
    wrap.remove();
    toast(`Costos actualizados: ${cambiados} producto${cambiados===1?'':'s'}`);
    render();
  });
}

function openSublimarModal(main){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  const materiasPrimasTodas = state.productos.filter(p=>p.categoria==='materia_prima');
  const materiasPrimas = materiasPrimasTodas.filter(p=>stockPropio(p.id)>0);

  if(!materiasPrimasTodas.length){
    wrap.innerHTML = `
      <div class="modal">
        <h3>Sublimar</h3>
        <p class="view-sub" style="margin:0 0 14px;">Todavía no tenés ningún producto cargado como "Materia prima".</p>
        <div class="hint-box">💡 Marcá como materia prima las superficies en blanco que comprás (tazas, remeras, llaveros, etc.) con el botón "🏷️ Reclasificar" en Productos. Después vas a poder sublimarlas desde acá.</div>
        <div class="modal-actions"><button class="btn btn-primary" id="cancelBtn">Entendido</button></div>
      </div>
    `;
    document.body.appendChild(wrap);
    wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
    // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.
    return;
  }
  if(!materiasPrimas.length){
    wrap.innerHTML = `
      <div class="modal">
        <h3>Sublimar</h3>
        <p class="view-sub" style="margin:0 0 14px;">Tenés materias primas cargadas, pero ninguna con stock disponible en este momento.</p>
        <div class="hint-box">💡 Registrá una compra para reponer stock de la materia prima que quieras sublimar, y después volvé a intentarlo acá.</div>
        <div class="modal-actions"><button class="btn btn-primary" id="cancelBtn">Entendido</button></div>
      </div>
    `;
    document.body.appendChild(wrap);
    wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
    // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.
    return;
  }

  wrap.innerHTML = `
    <div class="modal">
      <h3>🔥 Sublimar</h3>
      <p class="view-sub" style="margin:0 0 14px;">Elegí qué materia prima vas a usar y qué producto terminado sale de sublimarla.</p>

      <div class="field">
        <label>Materia prima a utilizar</label>
        <select id="fMateriaPrima">
          ${materiasPrimas.map(mp=>`<option value="${mp.id}">${escapeHtml(mp.nombre)} (stock: ${stockPropio(mp.id)})</option>`).join('')}
        </select>
      </div>

      <div class="field">
        <label>Producto terminado que se obtiene</label>
        <select id="fProductoTerminado"></select>
        <div class="field-note" id="notaProductoTerminado"></div>
      </div>

      <div id="bloqueNuevoTerminado" style="display:none;">
        <p class="view-sub" style="margin:0 0 10px;">Va a quedar como <b class="mono" style="color:var(--ink);">${generarCodigoInterno()}</b></p>
        <div class="field"><label>Nombre del producto terminado nuevo</label><input id="fNombreNuevoTerminado" placeholder="Ej: Taza con diseño de flores"></div>
        <div class="field-row">
          <div class="field"><label>Precio de venta</label><input id="fPrecioNuevoTerminado" type="number" placeholder="0"></div>
          <div class="field"><label>Precio Plastipel</label><input id="fPrecioConsigNuevoTerminado" type="number" placeholder="0"></div>
        </div>
        <div class="field-note" id="notaPrecioSugerido" style="margin:-8px 0 12px;"></div>
      </div>

      <div class="field-row">
        <div class="field"><label>Cantidad a producir</label><input id="fCantidad" type="number" min="1" value="1"></div>
        <div class="field"><label>Fecha</label><input id="fFecha" type="date" value="${hoyISO()}"></div>
      </div>
      <div class="breakdown-box" id="consumoBox"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">Cancelar</button>
        <button class="btn btn-teal" id="saveBtn">Confirmar sublimado</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  function terminadosDeEstaMateriaPrima(mpId){
    return state.productos.filter(p=>p.categoria==='producto_terminado' && p.materiaPrimaId===mpId);
  }

  function actualizarListaTerminados(){
    const mpId = wrap.querySelector('#fMateriaPrima').value;
    const disponibles = terminadosDeEstaMateriaPrima(mpId);
    const sel = wrap.querySelector('#fProductoTerminado');
    sel.innerHTML = disponibles.map(p=>`<option value="${p.id}">${escapeHtml(p.nombre)}</option>`).join('')
      + `<option value="__nuevo__">+ Crear producto terminado nuevo a partir de esta materia prima</option>`;
    const nota = wrap.querySelector('#notaProductoTerminado');
    nota.textContent = disponibles.length
      ? `Ya tenés ${disponibles.length} producto${disponibles.length===1?'':'s'} terminado${disponibles.length===1?'':'s'} vinculado${disponibles.length===1?'':'s'} a esta materia prima.`
      : 'Todavía no hay ningún producto terminado vinculado a esta materia prima — elegí "Crear producto terminado nuevo".';
    actualizarModoNuevo();
  }
  function actualizarModoNuevo(){
    const esNuevo = wrap.querySelector('#fProductoTerminado').value === '__nuevo__';
    wrap.querySelector('#bloqueNuevoTerminado').style.display = esNuevo ? '' : 'none';
    if(esNuevo && !wrap._preciosSugeridosAplicados){
      const mp = findProd(wrap.querySelector('#fMateriaPrima').value);
      if(mp){
        const adicional = state.config.adicionalSublimado || 0;
        wrap.querySelector('#fPrecioNuevoTerminado').value = (mp.precioVenta||0) + adicional;
        wrap.querySelector('#fPrecioConsigNuevoTerminado').value = (mp.precioConsignacion||0) + adicional;
        wrap.querySelector('#notaPrecioSugerido').textContent =
          `Sugerido: precio del blanco (${money(mp.precioVenta||0)} venta / ${money(mp.precioConsignacion||0)} Plastipel) + adicional por sublimado (${money(adicional)}). Lo podés cambiar libremente.`;

        const inputNombre = wrap.querySelector('#fNombreNuevoTerminado');
        inputNombre.value = `${mp.nombre} - `;
        inputNombre.placeholder = `Ej: ${mp.nombre} - Dragon Ball Z`;
        // el cursor queda al final, listo para escribir solo la parte del diseño
        inputNombre.focus();
        inputNombre.setSelectionRange(inputNombre.value.length, inputNombre.value.length);

        wrap._preciosSugeridosAplicados = true;
      }
    }
  }

  function pintarConsumo(){
    const mp = findProd(wrap.querySelector('#fMateriaPrima').value);
    const cantidad = Number(wrap.querySelector('#fCantidad').value)||0;
    const esNuevo = wrap.querySelector('#fProductoTerminado').value === '__nuevo__';
    const disponibleMp = mp ? stockPropio(mp.id) : 0;
    let filasHtml = `
      <div class="breakdown-row"><span>${escapeHtml(mp?mp.nombre:'—')} (materia prima)</span><b style="color:${disponibleMp<cantidad?'var(--red)':'var(--text)'};">${cantidad} / disp. ${disponibleMp}</b></div>
    `;
    let hayFaltante = disponibleMp < cantidad;
    let receta = [];
    let costoUnit = mp ? (mp.costo||0) : 0;
    if(!esNuevo){
      const p = findProd(wrap.querySelector('#fProductoTerminado').value);
      if(p){
        receta = recetaDe(p.id);
        for(const r of receta){
          const ins = findProd(r.insumoId);
          const necesario = r.cantidadPorUnidad * cantidad;
          const disp = ins ? stockPropio(ins.id) : 0;
          if(disp < necesario) hayFaltante = true;
          filasHtml += `<div class="breakdown-row"><span>${escapeHtml(ins?ins.nombre:'—')}</span><b style="color:${disp<necesario?'var(--red)':'var(--text)'};">${necesario} / disp. ${disp}</b></div>`;
        }
        costoUnit = costeoAbsorcion(p).total;
      }
    }
    filasHtml += `<div class="breakdown-row total"><span>Costo estimado (${cantidad} u.)</span><span>${money(costoUnit*cantidad)}</span></div>`;
    wrap.querySelector('#consumoBox').innerHTML = filasHtml;
    return {mp, cantidad, receta, hayFaltante, esNuevo};
  }

  wrap.querySelector('#fMateriaPrima').addEventListener('change', ()=>{ wrap._preciosSugeridosAplicados = false; actualizarListaTerminados(); pintarConsumo(); });
  wrap.querySelector('#fProductoTerminado').addEventListener('change', ()=>{ actualizarModoNuevo(); pintarConsumo(); });
  wrap.querySelector('#fCantidad').addEventListener('input', pintarConsumo);
  actualizarListaTerminados();
  pintarConsumo();

  wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
  // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.
  wrap.querySelector('#saveBtn').addEventListener('click', async ()=>{
    const {mp, cantidad, hayFaltante, esNuevo} = pintarConsumo();
    if(cantidad<=0){ toast('Ingresá una cantidad válida'); return; }

    let p;
    if(esNuevo){
      const nombreNuevo = wrap.querySelector('#fNombreNuevoTerminado').value.trim();
      if(!nombreNuevo){ toast('Ponele un nombre al producto terminado nuevo'); return; }
      if(!wrap._productoNuevoCreado){
        p = {
          id: uid('p'),
          codigoInterno: generarCodigoInterno(),
          codigo: mp.codigo || '',
          nombre: nombreNuevo,
          categoria: 'producto_terminado',
          materiaPrimaId: mp.id,
          costo: 0,
          costoAnterior: null,
          fechaCambioCosto: null,
          costoMateriales: 0,
          horasDiseno: 0,
          tarifaHoraOverride: null,
          costoProcesoPctOverride: null,
          gastosIndirectosPctOverride: null,
          precioVenta: Number(wrap.querySelector('#fPrecioNuevoTerminado').value)||0,
          precioConsignacion: Number(wrap.querySelector('#fPrecioConsigNuevoTerminado').value)||0,
          stock: 0,
          tieneImagen: false,
        };
        p.costo = Math.round(costeoAbsorcion(p).total);
        state.productos.push(p);
        wrap._productoNuevoCreado = p;
      }
      p = wrap._productoNuevoCreado;
    }else{
      p = findProd(wrap.querySelector('#fProductoTerminado').value);
    }
    if(!p){ toast('Elegí un producto terminado'); return; }
    const receta = recetaDe(p.id);

    if(hayFaltante){
      toast('⛔ No hay stock suficiente de materia prima o algún insumo para esta cantidad. Registrá primero la compra que falta.');
      return;
    }

    if(!wrap._registrado){
      const fecha = wrap.querySelector('#fFecha').value || hoyISO();
      const loteId = uid('lote');
      const nuevos = [];
      nuevos.push({id:uid('m'), tipo:'produccion_terminado', productoId:p.id, productoNombre:p.nombre, cantidad, precioUnitario:0, total:0, fecha, detalle:'Sublimado', loteId});
      nuevos.push({id:uid('m'), tipo:'consumo_materia_prima', productoId:mp.id, productoNombre:mp.nombre, cantidad, precioUnitario:0, total:0, fecha, detalle:`Consumo para ${p.nombre}`, loteId});
      for(const r of receta){
        const ins = findProd(r.insumoId);
        if(!ins) continue;
        nuevos.push({id:uid('m'), tipo:'consumo_insumo', productoId:ins.id, productoNombre:ins.nombre, cantidad: r.cantidadPorUnidad*cantidad, precioUnitario:0, total:0, fecha, detalle:`Consumo para ${p.nombre}`, loteId});
      }
      nuevos.forEach(m=>{ state.movimientos.push(m); syncBackend('guardarMovimiento', {movimiento:m}); });
      wrap._registrado = true;
    }
    const btn = wrap.querySelector('#saveBtn');
    btn.textContent = 'Guardando…'; btn.disabled = true;
    const okProd = esNuevo ? await saveProductos() : true;
    const okMov = await saveMovimientos();
    btn.disabled = false;
    if(!okProd || !okMov){ btn.textContent = 'Reintentar guardado'; return; }
    wrap.remove();
    toast(`Se sublimaron ${cantidad} unidades de ${p.nombre}`);
    render();
  });
}

function openLiquidacionModal(main){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  const disponibles = state.productos.filter(p=>stockEnConsignacion(p.id)>0);
  const opciones = (disponibles.length?disponibles:state.productos).map(p=>
    `<option value="${p.id}">${escapeHtml(p.nombre)} ${stockEnConsignacion(p.id)>0?`(disp: ${stockEnConsignacion(p.id)})`:''}</option>`
  ).join('');
  wrap.innerHTML = `
    <div class="modal">
      <h3>Liquidación de Plastipel</h3>
      <p class="view-sub" style="margin:0 0 14px;">Registrá lo que Plastipel confirmó como vendido este período.</p>
      <div class="field"><label>Producto</label><select id="fProducto">${opciones}</select></div>
      <div class="field">
        <label>Diseño vendido (opcional)</label>
        <input id="fSobrenombre" list="sobrenombresListLiq" placeholder="Ej: El Principito">
        <datalist id="sobrenombresListLiq"></datalist>
        <div class="field-note" id="sobrenombreNoteLiq"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Cantidad vendida</label><input id="fCantidad" type="number" min="1" value="1"></div>
        <div class="field"><label>Fecha de liquidación</label><input id="fFecha" type="date" value="${hoyISO()}"></div>
      </div>
      <div class="field"><label>Precio unitario liquidado</label><input id="fPrecio" type="number"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">Cancelar</button>
        <button class="btn btn-teal" id="saveBtn">Registrar liquidación</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  function actualizarPrecio(){
    const p = findProd(wrap.querySelector('#fProducto').value);
    wrap.querySelector('#fPrecio').value = p ? p.precioConsignacion : 0;
    const disp = sobrenombresDisponibles(p ? p.id : '');
    wrap.querySelector('#sobrenombresListLiq').innerHTML = disp.map(s=>`<option value="${escapeHtml(s.sobrenombre)}">`).join('');
    const nota = wrap.querySelector('#sobrenombreNoteLiq');
    nota.textContent = disp.length
      ? 'Diseños de este producto en Plastipel: ' + disp.map(s=>`${escapeHtml(s.sobrenombre)} (${s.cantidad})`).join(', ') + '.'
      : 'No hay diseños con sobrenombre pendientes para este producto.';
  }
  wrap.querySelector('#fProducto').addEventListener('change', actualizarPrecio);
  actualizarPrecio();
  wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
  // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.
  wrap.querySelector('#saveBtn').addEventListener('click', async ()=>{
    const prodId = wrap.querySelector('#fProducto').value;
    const p = findProd(prodId);
    const cantidad = Number(wrap.querySelector('#fCantidad').value)||0;
    const precioUnit = Number(wrap.querySelector('#fPrecio').value)||0;
    const sobrenombre = wrap.querySelector('#fSobrenombre').value.trim();
    if(!p||cantidad<=0){ toast('Revisá producto y cantidad'); return; }
    if(!wrap._registrado){
      if(sobrenombre){
        const alias = stockEnConsignacionDetallado().find(x=>x.productoId===prodId && x.sobrenombre===sobrenombre);
        const dispAlias = alias ? alias.cantidad : 0;
        if(dispAlias < cantidad){
          toast(`⛔ Para el diseño "${sobrenombre}" solo figuran ${dispAlias} unidades enviadas.`);
          return;
        }
      }else if(stockEnConsignacion(prodId) < cantidad){
        toast(`⛔ Solo figuran ${stockEnConsignacion(prodId)} unidades enviadas de este producto.`);
        return;
      }
      const nuevoMov = {
        id: uid('m'), tipo:'liquidacion_consignacion', productoId: prodId, productoNombre: p.nombre,
        cantidad, precioUnitario: precioUnit, total: precioUnit*cantidad,
        fecha: wrap.querySelector('#fFecha').value || hoyISO(), detalle:'Liquidación mensual',
        sobrenombre: sobrenombre || null, consignatario: CONSIGNATARIO,
      };
      state.movimientos.push(nuevoMov);
      syncBackend('guardarMovimiento', {movimiento: nuevoMov});
      wrap._registrado = true;
    }
    const btn = wrap.querySelector('#saveBtn');
    btn.textContent = 'Guardando…'; btn.disabled = true;
    const ok = await saveMovimientos();
    btn.disabled = false;
    if(!ok){ btn.textContent = 'Reintentar guardado'; return; }
    wrap.remove();
    toast('Liquidación registrada');
    render();
  });
}

function ultimosPeriodos(n){
  const out = [];
  const d = new Date();
  for(let i=0;i<n;i++){
    out.unshift(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
    d.setMonth(d.getMonth()-1);
  }
  return out;
}

/* =========================================================

function cartFind(prodId){ return state.cart.find(c=>c.productoId===prodId); }
function cartAdd(prodId, cant=1){
  const item = cartFind(prodId);
  if(item) item.cantidad += cant;
  else state.cart.push({productoId: prodId, cantidad: cant});
}
function cartSetQty(prodId, cant){
  const item = cartFind(prodId);
  if(!item) return;
  item.cantidad = cant;
  if(item.cantidad <= 0) state.cart = state.cart.filter(c=>c.productoId!==prodId);
}
function cartRemove(prodId){
  state.cart = state.cart.filter(c=>c.productoId!==prodId);
}
function cartCount(){ return state.cart.reduce((a,c)=>a+c.cantidad,0); }
function cartTotal(){
  return state.cart.reduce((a,c)=>{
    const p = findProd(c.productoId);
    return a + (p ? p.precioVenta*c.cantidad : 0);
  },0);
}

let catFiltro = '';
let catRenderGen = 0;

  main.innerHTML = `

    <div class="grad-bar"></div>
