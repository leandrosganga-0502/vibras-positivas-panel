function copiarLinkCatalogo(){
  const url = new URL(window.location.href);
  url.searchParams.set('cliente', '1');
  const link = url.toString();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(
      ()=> toast('Link copiado — pegalo donde quieras compartirlo'),
      ()=> prompt('Copiá este link:', link)
    );
  }else{
    prompt('Copiá este link:', link);
  }
}

async function renderCatalogoGrid(main){
  const miGen = ++catRenderGen;
  const term = catFiltro.trim().toLowerCase();
  const lista = state.productos.filter(p =>
    (p.categoria||'producto_terminado')==='producto_terminado' &&
    (!term || p.nombre.toLowerCase().includes(term) || (p.codigo||'').toLowerCase().includes(term))
  );
  const grid = document.getElementById('catGrid');
  const emptyBox = document.getElementById('catEmpty');
  if(!grid) return;
  grid.innerHTML = '';
  emptyBox.innerHTML = !lista.length ? '<div class="empty">No se encontraron productos.</div>' : '';

  for(const p of lista){
    if(miGen !== catRenderGen) return;
    const card = document.createElement('div');
    card.className = 'cat-card';
    const img = (await getImage(p.id, 'sublimado')) || (await getImage(p.id, 'blanco'));
    const stock = stockPropio(p.id);
    const enCarrito = cartFind(p.id);
    card.innerHTML = `
      <div class="cat-card-img">${img ? `<img src="${img}">` : '🖼'}</div>
      <div class="cat-card-body">
        <div class="cat-card-name">${escapeHtml(p.nombre)}</div>
        <div class="cat-card-price">${money(p.precioVenta)}</div>
        <div class="cat-card-stock">${stock>0 ? `${stock} disponibles` : 'A pedido / sin stock inmediato'}</div>
        <button type="button" class="cat-add-btn ${enCarrito?'in-cart':''}" data-add="${p.id}">
          ${enCarrito ? `✓ En el pedido (${enCarrito.cantidad})` : '+ Agregar'}
        </button>
      </div>
    `;
    if(miGen !== catRenderGen) return;
    grid.appendChild(card);
  }
  if(miGen !== catRenderGen) return;

  grid.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      cartAdd(btn.dataset.add, 1);
      renderCatalogoGrid(main);
      actualizarCartBar();
    });
  });
}

function actualizarCartBar(){
  const bar = document.getElementById('cartBar');
  if(!bar) return;
  const count = cartCount();
  bar.classList.toggle('hidden', count===0);
  document.getElementById('cartBarText').textContent = `Ver pedido · ${money(cartTotal())}`;
  document.getElementById('cartBarBadge').textContent = count;
}

async function openCarritoModal(main){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `
    <div class="modal">
      <h3>Tu pedido</h3>
      <p class="view-sub" style="margin:0 0 10px;">Revisá las cantidades antes de coordinar por WhatsApp.</p>
      <div id="cartLines"></div>
      <div class="breakdown-box" style="margin-top:12px;">
        <div class="breakdown-row total"><span>Total del pedido</span><span id="cartTotalTxt">${money(cartTotal())}</span></div>
      </div>
      <div style="height:1px;background:var(--border);margin:14px 0;"></div>
      <div class="field-row">
        <div class="field"><label>Tu nombre</label><input id="fClienteNombre" placeholder="Nombre y apellido"></div>
        <div class="field"><label>Tu teléfono</label><input id="fClienteTelefono" placeholder="Ej: 1122334455" type="tel"></div>
      </div>
      <div class="field-note" style="margin:-8px 0 4px;">Así te podemos contactar para coordinar el pedido.</div>
      <div class="modal-actions" style="justify-content:space-between;">
        <button class="btn btn-outline" id="btnVaciar">Vaciar</button>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" id="cancelBtn">Cerrar</button>
          <button class="btn btn-primary" id="btnWhatsapp">Completar por WhatsApp</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  async function pintarLineas(){
    const cont = wrap.querySelector('#cartLines');
    if(!state.cart.length){
      cont.innerHTML = '<div class="empty">Todavía no agregaste productos.</div>';
      wrap.querySelector('#cartTotalTxt').textContent = money(0);
      return;
    }
    const filas = [];
    for(const item of state.cart){
      const p = findProd(item.productoId);
      if(!p) continue;
      const img = (await getImage(p.id, 'sublimado')) || (await getImage(p.id, 'blanco'));
      filas.push(`
        <div class="cart-line" data-line="${p.id}">
          ${img ? `<img class="cart-line-img" src="${img}">` : `<div class="cart-line-img"></div>`}
          <div style="flex:1;min-width:0;">
            <div class="cart-line-name">${escapeHtml(p.nombre)}</div>
            <div class="cart-line-price">${money(p.precioVenta)} c/u</div>
          </div>
          <div class="qty-stepper">
            <button type="button" data-menos="${p.id}">−</button>
            <span>${item.cantidad}</span>
            <button type="button" data-mas="${p.id}">+</button>
          </div>
          <div class="mono" style="min-width:70px;text-align:right;font-weight:600;color:var(--ink);">${money(p.precioVenta*item.cantidad)}</div>
          <button type="button" class="btn-icon" data-quitar="${p.id}" title="Quitar">✕</button>
        </div>
      `);
    }
    cont.innerHTML = filas.join('');
    wrap.querySelector('#cartTotalTxt').textContent = money(cartTotal());

    cont.querySelectorAll('[data-mas]').forEach(b=>b.addEventListener('click', async ()=>{
      cartAdd(b.dataset.mas, 1); await pintarLineas(); actualizarCartBar();
    }));
    cont.querySelectorAll('[data-menos]').forEach(b=>b.addEventListener('click', async ()=>{
      const item = cartFind(b.dataset.menos);
      if(item) cartSetQty(b.dataset.menos, item.cantidad-1);
      await pintarLineas(); actualizarCartBar();
    }));
    cont.querySelectorAll('[data-quitar]').forEach(b=>b.addEventListener('click', async ()=>{
      cartRemove(b.dataset.quitar);
      await pintarLineas(); actualizarCartBar();
    }));
  }
  await pintarLineas();

  wrap.querySelector('#cancelBtn').addEventListener('click', async ()=>{ wrap.remove(); await renderCatalogoGrid(main); });
  wrap.addEventListener('click', async (e)=>{ if(e.target===wrap){ wrap.remove(); await renderCatalogoGrid(main); } });
  wrap.querySelector('#btnVaciar').addEventListener('click', async ()=>{
    if(!state.cart.length) return;
    if(!confirm('¿Vaciar todo el pedido?')) return;
    state.cart = [];
    await pintarLineas();
    actualizarCartBar();
  });
  wrap.querySelector('#btnWhatsapp').addEventListener('click', async ()=>{
    if(!state.cart.length){ toast('Agregá al menos un producto'); return; }
    const nombreCliente = wrap.querySelector('#fClienteNombre').value.trim();
    const telCliente = wrap.querySelector('#fClienteTelefono').value.trim();
    if(!nombreCliente || !telCliente){ toast('Completá tu nombre y teléfono para continuar'); return; }

    const btn = wrap.querySelector('#btnWhatsapp');
    btn.textContent = 'Generando pedido…'; btn.disabled = true;

    const itemsPedido = state.cart.map(item=>{
      const p = findProd(item.productoId);
      return p ? {productoId:p.id, nombre:p.nombre, cantidad:item.cantidad, precioUnitario:p.precioVenta, subtotal:p.precioVenta*item.cantidad} : null;
    }).filter(Boolean);
    const total = cartTotal();

    const numero = await generarNumeroPedido(nombreCliente, telCliente, itemsPedido, total);
    syncBackend('guardarContacto', {contacto:{id: uid('c'), nombre:nombreCliente, telefono:telCliente, fecha: hoyISO()}});

    const lineas = itemsPedido.map((it,i)=>`${i+1}) ${it.nombre} x${it.cantidad} = ${money(it.subtotal)}`);
    const msg = [
      `🧾 *Pedido #${numero} — ${state.config.nombreEmprendimiento}*`,
      '',
      `Cliente: ${nombreCliente}`,
      `Teléfono: ${telCliente}`,
      '',
      ...lineas,
      '',
      `*Total: ${money(total)}*`,
      '',
      '(Te escribo para coordinar pago y entrega 😊)',
    ].join('\n');
    const numeroNegocio = (state.config.whatsappNegocio||'').replace(/[^\d]/g,'');
    const url = numeroNegocio
      ? `https://wa.me/${numeroNegocio}?text=${encodeURIComponent(msg)}`
      : `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');

    btn.disabled = false; btn.textContent = 'Completar por WhatsApp';
    state.cart = [];
    wrap.remove();
    actualizarCartBar();
    await renderCatalogoGrid(main);
    toast(`Pedido #${numero} generado`);
  });
}

async function generarNumeroPedido(nombre, telefono, items, total){
  if(state.config.backendUrl){
    const r = await apiCall('crearPedido', {pedido:{contactoNombre:nombre, contactoTelefono:telefono, items, total}});
    if(r && r.ok && r.pedido) return r.pedido.numero;
  }
  const n = state.config.siguienteNumeroPedido || 1;
  state.config.siguienteNumeroPedido = n + 1;
  await saveConfig();
  return n;
}

const KEY_DESBLOQUEADO = 'panelDesbloqueado';
async function marcarDesbloqueado(){
  try{ if(window.storage) await window.storage.set(KEY_DESBLOQUEADO, '1', false); }catch(e){ /* no pasa nada, queda solo para esta sesión */ }
  try{ localStorage.setItem(KEY_DESBLOQUEADO, '1'); }catch(e){ /* algunos navegadores lo bloquean */ }
}
async function yaEstaDesbloqueado(){
  try{
    if(window.storage){
      const r = await window.storage.get(KEY_DESBLOQUEADO, false);
      if(r && r.value==='1') return true;
    }
  }catch(e){ /* sigue probando con localStorage */ }
  try{ if(localStorage.getItem(KEY_DESBLOQUEADO)==='1') return true; }catch(e){}
  return false;
}

function mostrarPantallaClave(){
  const app = document.getElementById('app');
  app.style.display = 'flex';
  app.innerHTML = `
    <div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px;">
      <img src="${state.logo}" alt="logo" style="width:64px;height:64px;border-radius:50%;object-fit:cover;">
      <div style="text-align:center;">
        <div class="brand-name" style="font-size:19px;">${escapeHtml(state.config.nombreEmprendimiento)}</div>
        <div class="brand-sub2">Panel de gestión — acceso restringido</div>
      </div>
      <div style="width:100%;max-width:320px;">
        <div class="field">
          <label>Clave de acceso</label>
          <input id="fClaveIngresada" type="password" placeholder="Ingresá la clave">
        </div>
        <div id="errorClave" style="color:var(--red);font-size:12.5px;margin:-6px 0 10px;display:none;">Clave incorrecta. Probá de nuevo.</div>
        <button class="btn btn-primary" id="btnEntrar" style="width:100%;justify-content:center;">Entrar</button>
      </div>
    </div>
  `;
  const input = document.getElementById('fClaveIngresada');
  const error = document.getElementById('errorClave');
  input.focus();
  async function intentarEntrar(){
    if(input.value === state.config.clavePanel){
      await marcarDesbloqueado();
      render();
    }else{
      error.style.display = 'block';
      input.value = '';
      input.focus();
    }
  }
  document.getElementById('btnEntrar').addEventListener('click', intentarEntrar);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') intentarEntrar(); });
}

init();
async function init(){
  await loadAll();
  try{
    const params = new URLSearchParams(window.location.search);
    if(params.get('cliente')==='1'){
      state.modoCliente = true;
      state.view = 'catalogo';
    }
  }catch(e){ /* ignorar si no hay acceso a location */ }

  // El catálogo para clientes queda siempre abierto, sin pedir clave.
  // Solo se protege la gestión interna.
  if(!state.modoCliente && state.config.clavePanel){
    const desbloqueado = await yaEstaDesbloqueado();
    if(!desbloqueado){ mostrarPantallaClave(); return; }
  }
  render();
}
</script>
