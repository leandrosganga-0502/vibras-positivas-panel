<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vibras Positivas — Panel de gestión</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#0A0908;
  --panel:#121110;
  --card:#161410;
  --card-head:#1D1A13;
  --card-hover:#1B1812;
  --text:#ECE3CE;
  --ink:#D4AF37;
  --ink-soft:#B0A588;
  --ink-faint:#756A52;
  --border:#2E2A1C;
  --gold-light:#EAD692;
  --gold-deep:#8C6D1F;
  --heat:#C15C74;
  --cyan:#5AA0B8;
  --amber:#E0954A;
  --green:#5FAE72;
  --teal:#3FB3A4;
  --red:#C1554A;
  --grad: linear-gradient(90deg, var(--gold-deep), var(--ink), var(--gold-light));
  --radius:14px;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;color:var(--ink);}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

#app{display:flex;flex-direction:column;min-height:100vh;}
.app-row{display:flex;flex:1;min-width:0;}

/* ---------- Sidebar (desktop) ---------- */
.sidebar{
  width:220px;flex-shrink:0;background:var(--panel);color:var(--text);border-right:1px solid var(--border);
  padding:24px 16px;display:flex;flex-direction:column;gap:4px;
}
.brand{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:var(--ink);
  margin-bottom:4px;letter-spacing:-0.02em;
}
.brand-sub{
  font-size:11px;color:var(--ink-faint);margin-bottom:26px;
  text-transform:uppercase;letter-spacing:.08em;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  color:var(--ink-soft);font-size:14px;font-weight:500;background:none;border:none;
  text-align:left;width:100%;transition:background .15s, color .15s;
}
.nav-item:hover{background:rgba(212,175,55,.08);color:var(--text);}
.nav-item.active{background:rgba(212,175,55,.14);color:var(--ink);}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;flex-shrink:0;}
.nav-item.active .dot{background:var(--ink);opacity:1;}

/* ---------- Main ---------- */
main{flex:1;min-width:0;padding:28px 32px 100px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.view-title{font-size:24px;font-weight:700;margin:0 0 2px;color:var(--ink);}
.view-sub{color:var(--ink-soft);font-size:13.5px;margin:0;}

.grad-bar{height:3px;border-radius:3px;background:var(--grad);width:44px;margin:10px 0 18px;}

/* ---------- Cards / grid ---------- */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 20px;
}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.kpi{position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--ink));}
.kpi-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;}
.kpi-value{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-top:6px;color:var(--ink);}
.kpi-note{font-size:12px;color:var(--ink-faint);margin-top:4px;}

.section-title{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--ink);}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

/* ---------- Buttons ---------- */
.btn{
  border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;transition:transform .1s, opacity .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:#171410;}
.btn-primary:hover{opacity:.88;}
.btn-outline{background:var(--card);border-color:var(--border);color:var(--text);}
.btn-outline:hover{background:var(--card-hover);}
.btn-heat{background:var(--heat);color:#fff;}
.btn-teal{background:var(--teal);color:#0E1211;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
.btn-icon{padding:6px 8px;background:none;border:1px solid var(--border);border-radius:7px;color:var(--ink-soft);}
.btn-icon:hover{background:var(--card-hover);color:var(--ink);}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);
  font-weight:700;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--card-head);white-space:nowrap;
}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--card-hover);}
.prod-thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;background:#221E14;border:1px solid var(--border);flex-shrink:0;}
.prod-thumb-empty{width:36px;height:36px;border-radius:8px;background:#221E14;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:14px;flex-shrink:0;}
.prod-cell{display:flex;align-items:center;gap:10px;}
.prod-name{font-weight:600;font-size:13.5px;color:var(--text);}
.prod-code{font-size:11px;color:var(--ink-faint);}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.badge-up{background:rgba(224,149,74,.15);color:var(--amber);}
.badge-teal{background:rgba(63,179,164,.15);color:var(--teal);}
.badge-green{background:rgba(95,174,114,.15);color:var(--green);}
.badge-red{background:rgba(193,85,74,.15);color:var(--red);}
.badge-gray{background:rgba(176,165,136,.12);color:var(--ink-soft);}

.editable{border:1px solid transparent;background:none;border-radius:6px;padding:4px 6px;width:88px;font-size:13.5px;font-family:'JetBrains Mono',monospace;color:var(--ink);}
.editable:hover{border-color:var(--border);}
.editable:focus{outline:none;border-color:var(--ink);background:var(--card-hover);}
.editable-name{width:100%;font-family:'Inter',sans-serif;font-weight:600;color:var(--text);padding:4px 6px;font-size:13.5px;}

.value-view{display:flex;align-items:center;gap:6px;min-width:0;}
.value-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.value-text.name-text{font-weight:600;color:var(--text);}
.pencil-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:12px;padding:3px 5px;border-radius:6px;opacity:.55;flex-shrink:0;line-height:1;}
.pencil-btn:hover{opacity:1;color:var(--ink);background:rgba(212,175,55,.12);}
.pencil-ok{color:var(--green);opacity:.85;}
.pencil-cancel{color:var(--red);opacity:.85;}

/* ---------- Forms / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.modal h3{margin:0 0 4px;font-size:18px;color:var(--ink);}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:14px;background:#1A1811;color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink);background:var(--card-hover);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.imgpick{
  width:100%;height:110px;border:1.5px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:4px;color:var(--ink-faint);font-size:12.5px;cursor:pointer;background:#1A1811;overflow:hidden;position:relative;
}
.imgpick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.imgpick input{position:absolute;inset:0;opacity:0;cursor:pointer;}

/* ---------- Alerts list ---------- */
.alert-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.alert-row:last-child{border-bottom:none;}
.alert-left{display:flex;align-items:center;gap:10px;min-width:0;}
.alert-txt{font-size:13px;font-weight:600;color:var(--text);}
.alert-sub{font-size:11.5px;color:var(--ink-faint);}

/* ---------- Empty state ---------- */
.empty{padding:34px 20px;text-align:center;color:var(--ink-faint);font-size:13.5px;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel);border:1px solid var(--border);color:var(--gold-light);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Chips / tabs within view ---------- */
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.chip{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--ink-soft);}
.chip.active{background:var(--ink);color:#171410;border-color:var(--ink);}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filter-bar select,.filter-bar input{padding:8px 11px;border:1px solid var(--border);border-radius:9px;font-size:13px;background:#1A1811;color:var(--text);}

/* ---------- Mobile bottom nav ---------- */
.bottom-nav{display:none;}
@media(max-width:820px){
  .sidebar{display:none;}
  main{padding:18px 14px 90px;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);z-index:80;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;
  }
  .bottom-nav button{
    background:none;border:none;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:10px;font-weight:600;padding:6px 4px;border-radius:8px;flex:1;
  }
  .bottom-nav button.active{color:var(--ink);}
  .bottom-nav .ic{font-size:17px;}
  .field-row{grid-template-columns:1fr;}
  .two-col{grid-template-columns:1fr;}
}

.icon-sq{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}

.link-btn{background:none;border:none;color:var(--cyan);font-weight:600;font-size:12.5px;padding:0;}

.hint-box{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.25);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--gold-light);margin-bottom:14px;line-height:1.5;}

/* ---------- Branding ---------- */
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.brand-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;background:rgba(212,175,55,.08);border:1px solid var(--border);}
.brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;line-height:1.15;letter-spacing:-0.01em;color:var(--ink);}
.brand-sub2{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;}
.gear-btn{margin-top:14px;margin-bottom:18px;background:none;border:1px solid var(--border);color:var(--ink-soft);
  border-radius:9px;padding:8px 10px;font-size:12px;width:100%;text-align:left;display:flex;align-items:center;gap:8px;}
.gear-btn:hover{background:rgba(212,175,55,.08);color:var(--ink);}
.bn-brand{display:none;}
.standalone-banner{
  background:#3A2A12;color:#F0C36D;border-bottom:1px solid #5A4420;
  padding:9px 16px;font-size:12.5px;text-align:center;
  flex-shrink:0;
}
.client-header{
  display:flex;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--border);
  padding:14px 18px;
}
.client-header img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.client-header span{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;}
@media(max-width:820px){
  .bn-brand{display:flex;align-items:center;gap:8px;position:fixed;top:0;left:0;right:0;background:var(--panel);border-bottom:1px solid var(--border);
    padding:10px 14px;z-index:79;}
  .bn-brand img{width:26px;height:26px;border-radius:50%;}
  .bn-brand span{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;}
  main{padding-top:60px;}
}

/* ---------- Costeo por absorción ---------- */
.costo-cell{display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:8px;padding:5px 7px;border:1px solid transparent;}
.costo-cell:hover{border-color:var(--border);background:var(--card-hover);}
.costo-total{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink);}
.costo-caret{font-size:10px;color:var(--ink-faint);}
.breakdown-box{background:#1A1811;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13px;}
.breakdown-row{display:flex;justify-content:space-between;padding:4px 0;color:var(--ink-soft);}
.breakdown-row b{color:var(--text);font-weight:600;}
.breakdown-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:8px;font-size:14.5px;}
.breakdown-row.total span:last-child{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--ink);}
.field-note{font-size:11px;color:var(--ink-faint);margin-top:3px;}
.imgpick-round{width:64px;height:64px;border-radius:50%;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;
  color:var(--ink-faint);font-size:11px;cursor:pointer;background:#1A1811;overflow:hidden;position:relative;flex-shrink:0;}
.imgpick-round img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.imgpick-round input{position:absolute;inset:0;opacity:0;cursor:pointer;}

/* ---------- Catálogo / carrito ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding-bottom:90px;}
.cat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
.cat-card-img{width:100%;aspect-ratio:1/1;background:#221E14;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:28px;overflow:hidden;}
.cat-card-img img{width:100%;height:100%;object-fit:cover;}
.cat-card-body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1;}
.cat-card-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;min-height:34px;}
.cat-card-price{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--ink);}
.cat-card-stock{font-size:10.5px;color:var(--ink-faint);}
.cat-add-btn{margin-top:auto;background:var(--ink);color:#171410;border:none;border-radius:8px;padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;}
.cat-add-btn:active{transform:scale(.97);}
.cat-add-btn.in-cart{background:var(--teal);color:#0E1211;}

.cart-bar{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;
  background:var(--ink);color:#171410;border-radius:30px;padding:12px 22px;
  display:flex;align-items:center;gap:12px;font-weight:700;font-size:13.5px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer;border:none;
}
.cart-bar.hidden{display:none;}
.cart-bar-badge{background:#171410;color:var(--ink);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11.5px;}
@media(max-width:820px){ .cart-bar{ bottom:80px; } }

.cart-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.cart-line:last-child{border-bottom:none;}
.cart-line-img{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#221E14;flex-shrink:0;}
.cart-line-name{font-size:13px;font-weight:600;color:var(--text);}
.cart-line-price{font-size:11.5px;color:var(--ink-faint);}
.qty-stepper{display:flex;align-items:center;gap:6px;}
.qty-stepper button{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--card-hover);color:var(--ink);font-size:14px;cursor:pointer;line-height:1;}
.qty-stepper span{min-width:18px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>

<script>
/* =========================================================

const KEY_PRODUCTOS = 'productos';
const KEY_MOVIMIENTOS = 'movimientos';
const KEY_CONFIG = 'config';
const KEY_LOGO = 'logo';
const KEY_RECETAS = 'recetas';
const CONSIGNATARIO = 'Plastipel';

let state = {
  view: 'dashboard',
  productos: [],
  movimientos: [],
  images: {},       // id -> dataURL (cache en memoria)
  logo: null,
  loaded: false,
  periodoFiltro: mesActualISO(),
  modoCliente: false,
  cart: [],          // {productoId, cantidad} — carrito de sesión, no se persiste
  recetas: [],        // {id, productoTerminadoId, insumoId, cantidadPorUnidad}
  config: {
    nombreEmprendimiento: window.BRAND_NAME_DEFAULT,
    tarifaHoraDiseno: 3500,
    costoProcesoPct: 12,
    gastosIndirectosPct: 15,
    cargoRevisionAdicional: 1200,
    adicionalSublimado: 2500,
    clavePanel: 'VP05022024*',
    whatsappNegocio: '',
    backendUrl: '',
    siguienteNumeroPedido: 1,
  },
};

function mesActualISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function hoyISO(){
  return new Date().toISOString().slice(0,10);
}
function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function money(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-AR', {maximumFractionDigits:0});
}
function pct(n){
  return (n>=0?'+':'') + n.toFixed(1) + '%';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* =========================================================
   BACKEND (Google Apps Script) — opcional
   Si hay una URL configurada, sincroniza cada cambio hacia la
   planilla. Si falla o no está configurado, el panel sigue
   funcionando con el almacenamiento normal sin cortarse.
   ========================================================= */
async function apiCall(accion, payload={}){
  const url = state.config.backendUrl;
  if(!url) return null;
  try{
    const fetchPromise = fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'}, // evita el preflight CORS con Apps Script
      body: JSON.stringify({accion, ...payload}),
    });
    const timeoutPromise = new Promise((_, reject)=>{
      setTimeout(()=>reject(new Error('Tiempo de espera agotado (8s)')), 8000);
    });
    const res = await Promise.race([fetchPromise, timeoutPromise]);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'El backend respondió con un error');
    return data;
  }catch(e){
    console.error('apiCall falló:', accion, e);
    return {ok:false, error:String(e)};
  }
}
// "fire and forget": intenta sincronizar pero nunca bloquea ni corta el guardado local
function syncBackend(accion, payload){
  if(!state.config.backendUrl) return;
  apiCall(accion, payload).then(r=>{
    if(r && r.ok===false) toast('⚠️ Se guardó localmente, pero no se pudo sincronizar con el backend.');
  });
}

// Google Sheets devuelve todo como string/vacío — hay que recomponer los tipos que usa el panel
function normalizarProductosDeBackend(lista){
  if(!Array.isArray(lista)) return null;
  return lista.map(p => ({
    id: String(p.id),
    codigoInterno: p.codigoInterno || '',
    codigo: p.codigo || '',
    nombre: p.nombre || '',
    categoria: p.categoria || 'producto_terminado',
    materiaPrimaId: p.materiaPrimaId || null,
    costoMateriales: Number(p.costoMateriales)||0,
    horasDiseno: Number(p.horasDiseno)||0,
    tarifaHoraOverride: p.tarifaHoraOverride===''||p.tarifaHoraOverride==null ? null : Number(p.tarifaHoraOverride),
    costoProcesoPctOverride: p.costoProcesoPctOverride===''||p.costoProcesoPctOverride==null ? null : Number(p.costoProcesoPctOverride),
    gastosIndirectosPctOverride: p.gastosIndirectosPctOverride===''||p.gastosIndirectosPctOverride==null ? null : Number(p.gastosIndirectosPctOverride),
    precioVenta: Number(p.precioVenta)||0,
    precioConsignacion: Number(p.precioConsignacion)||0,
    costo: Number(p.costo)||0,
    costoAnterior: p.costoAnterior===''||p.costoAnterior==null ? null : Number(p.costoAnterior),
    fechaCambioCosto: p.fechaCambioCosto || null,
    tieneImagen: !!p.imagenUrl,
    imagenUrl: p.imagenUrl || null,
    imagenSublimadaUrl: p.imagenSublimadaUrl || null,
  }));
}
function normalizarMovimientosDeBackend(lista){
  if(!Array.isArray(lista)) return null;
  return lista.map(m => ({
    id: String(m.id),
    tipo: m.tipo,
    productoId: String(m.productoId),
    productoNombre: m.productoNombre || '',
    cantidad: Number(m.cantidad)||0,
    precioUnitario: Number(m.precioUnitario)||0,
    total: Number(m.total)||0,
    fecha: m.fecha,
    detalle: m.detalle || '',
    proveedor: m.proveedor || null,
    sobrenombre: m.sobrenombre || null,
    consignatario: m.consignatario || null,
    loteId: m.loteId || null,
  }));
}

async function storageSetConReintento(key, value, shared, intentos=3){
  if(!window.storage){
    // Fuera de Claude: no hay almacenamiento del navegador — fallar rápido, sin reintentos
    return false;
  }
  let ultimoError = null;
  for(let i=0; i<intentos; i++){
    try{
      await window.storage.set(key, value, shared);
      return true;
    }catch(e){
      ultimoError = e;
      console.error(`storage.set falló (intento ${i+1}/${intentos})`, e);
      if(i < intentos-1){
        await new Promise(res=>setTimeout(res, 500*(i+1)));
      }
    }
  }
  console.error('storage.set agotó los reintentos', ultimoError);
  return false;
}

// En modo standalone (sin window.storage) pero con backend configurado, el guardado
// "de verdad" es contra el backend — no hay que tratar la falta de window.storage como error.
// Cuando el panel corre fuera de Claude (standalone, ej: GitHub Pages), no hay window.storage.
// Usamos localStorage SOLO para recordar la config de conexión (URL del backend, etc.)
// entre visitas, así no hay que volver a pegarla cada vez que se abre la página.
const LS_KEY_CONFIG = 'vibraspositivas_config_local';
function leerConfigDeLocalStorage(){
  try{
    const raw = localStorage.getItem(LS_KEY_CONFIG);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function guardarConfigEnLocalStorage(config){
  try{ localStorage.setItem(LS_KEY_CONFIG, JSON.stringify(config)); }catch(e){ /* algunos navegadores lo bloquean, no pasa nada */ }
}

async function guardarConBackendComoRespaldo(key, valorJson, accionBackend, payloadBackend, syncEnModoNormal=true){
  if(!window.storage && state.config.backendUrl){
    const r = await apiCall(accionBackend, payloadBackend);
    if(!r || !r.ok){
      toast('⚠️ No se pudo guardar en tu backend de Google. Probá de nuevo en un momento.');
      return false;
    }
    if(accionBackend==='guardarConfig') guardarConfigEnLocalStorage(state.config);
    return true;
  }
  const ok = await storageSetConReintento(key, valorJson, false);
  if(!ok) toast('⚠️ No se pudo guardar en el servidor. El cambio quedó solo en esta sesión — reintentá en un momento.');
  else if(accionBackend && syncEnModoNormal) syncBackend(accionBackend, payloadBackend);
  return ok;
}

// Trae productos/movimientos/config/recetas priorizando el backend (si hay uno configurado).
// Se usa tanto al arrancar como justo después de conectar un backend nuevo a mitad de sesión,
// para no quedarnos con datos viejos/semilla que después se puedan sincronizar por error.
async function recargarDatosPrincipal(){
  const usaBackend = !!state.config.backendUrl;
  let productosDeBackend = null, movimientosDeBackend = null, recetasDeBackend = null;

  if(usaBackend){
    try{
      const [rp, rm, rc, rr] = await Promise.all([
        apiCall('getProductos'),
        apiCall('getMovimientos'),
        apiCall('getConfig'),
        apiCall('getRecetas'),
      ]);
      if(rp && rp.ok) productosDeBackend = normalizarProductosDeBackend(rp.productos);
      if(rm && rm.ok) movimientosDeBackend = normalizarMovimientosDeBackend(rm.movimientos);
      if(rc && rc.ok && rc.config) state.config = {...state.config, ...rc.config, backendUrl: state.config.backendUrl};
      if(rr && rr.ok) recetasDeBackend = (rr.recetas||[]).map(r=>({id:String(r.id), productoTerminadoId:String(r.productoTerminadoId), insumoId:String(r.insumoId), cantidadPorUnidad:Number(r.cantidadPorUnidad)||0}));
    }catch(e){
      console.error('No se pudo leer del backend, se usa el almacenamiento local:', e);
    }
  }

  if(productosDeBackend && productosDeBackend.length){
    state.productos = productosDeBackend;
  }else if(!state.productos || !state.productos.length){
    try{
      const r = await window.storage.get(KEY_PRODUCTOS, false);
      state.productos = r ? JSON.parse(r.value) : null;
    }catch(e){ state.productos = null; }
    if(!state.productos || !state.productos.length){
      state.productos = JSON.parse(JSON.stringify(window.SEED_PRODUCTOS));
      await saveProductos();
    }
  }
  // migración: productos antiguos sin desglose de costeo por absorción
  let necesitaGuardar = false;
  for(const p of state.productos){
    if(p.costoMateriales === undefined){
      p.costoMateriales = p.costo || 0;
      p.horasDiseno = 0;
      p.tarifaHoraOverride = null;
      p.gastosIndirectosPctOverride = null;
      necesitaGuardar = true;
    }
    if(p.costoProcesoPctOverride === undefined){
      p.costoProcesoPctOverride = null;
      necesitaGuardar = true;
    }
    if(p.categoria === undefined){
      p.categoria = 'producto_terminado';
      p.materiaPrimaId = null;
      necesitaGuardar = true;
    }
  }
  // migración: productos antiguos sin código interno (VP0001, VP0002, ...)
  for(const p of state.productos){
    if(!p.codigoInterno){
      p.codigoInterno = generarCodigoInterno();
      necesitaGuardar = true;
    }
  }
  if(necesitaGuardar) await saveProductos();

  if(movimientosDeBackend){
    state.movimientos = movimientosDeBackend;
  }else if(!state.movimientos || !state.movimientos.length){
    try{
      const r = await window.storage.get(KEY_MOVIMIENTOS, false);
      state.movimientos = r ? JSON.parse(r.value) : [];
    }catch(e){ state.movimientos = []; }
  }

  try{
    const r = await window.storage.get(KEY_LOGO, false);
    state.logo = r ? r.value : window.DEFAULT_LOGO;
  }catch(e){ state.logo = state.logo || window.DEFAULT_LOGO; }

  if(recetasDeBackend){
    state.recetas = recetasDeBackend;
  }else if(!state.recetas || !state.recetas.length){
    try{
      const r = await window.storage.get(KEY_RECETAS, false);
      state.recetas = r ? JSON.parse(r.value) : [];
    }catch(e){ state.recetas = []; }
  }
}

async function getImage(id, tipo='blanco'){
  const p = findProd(id);
  const campo = tipo==='sublimado' ? 'imagenSublimadaUrl' : 'imagenUrl';
  if(p && p[campo]) return p[campo]; // viene de Drive vía el backend: funciona en cualquier dispositivo
  const claveLocal = id + ':' + tipo;
  if(state.images[claveLocal] !== undefined) return state.images[claveLocal];
  try{
    const r = await window.storage.get('img:'+claveLocal, false);
    state.images[claveLocal] = r ? r.value : null;
  }catch(e){ state.images[claveLocal] = null; }

}
async function setImage(id, dataUrl, tipo='blanco'){
  const claveLocal = id + ':' + tipo;
  state.images[claveLocal] = dataUrl; // vista previa inmediata mientras se termina de guardar
  const p = findProd(id);

/* =========================================================
   HELPERS DE NEGOCIO
   ========================================================= */
function findProd(id){ return state.productos.find(p=>p.id===id); }

// Autocompletado de productos: en vez de un <select> larguísimo, se usa un
// <input list="..."> con un <datalist> — el usuario escribe "taza" y el
// navegador le muestra los que coinciden, sin tener que scrollear una lista.
function textoProducto(p){ return `${p.codigoInterno||''} — ${p.nombre}`.trim(); }
function resolverProductoPorTexto(texto){
  if(!texto) return null;
  const limpio = texto.trim().toLowerCase();
  let p = state.productos.find(x => textoProducto(x).toLowerCase() === limpio);
  if(p) return p;
  p = state.productos.find(x => x.nombre.trim().toLowerCase() === limpio);
  return p || null;
}
function datalistProductosHTML(id, productos){
  return `<datalist id="${id}">${productos.map(p=>`<option value="${escapeHtml(textoProducto(p))}">`).join('')}</datalist>`;
}


function ultimoCostoCompra(prodId){
  const compras = state.movimientos
    .filter(m=>m.tipo==='compra' && m.productoId===prodId && m.precioUnitario>0)
    .sort((a,b)=> (b.fecha+b.id).localeCompare(a.fecha+a.id));
  return compras.length ? {costo: compras[0].precioUnitario, fecha: compras[0].fecha} : null;
}

function generarCodigoInterno(){
  let maxNum = 0;
  for(const p of state.productos){
    const m = /^VP(\d+)$/i.exec(p.codigoInterno||'');
    if(m) maxNum = Math.max(maxNum, parseInt(m[1],10));
  }
  const siguiente = maxNum + 1;
  return 'VP' + String(siguiente).padStart(4,'0');
}
// Para cuando se están por crear varios productos nuevos en el mismo lote (compra por planilla):
// calcula qué código VP le va a tocar a la fila "nuevo" que está en la posición `indiceEnLote`
// (0 = la primera fila nueva del lote, 1 = la segunda, etc.), sin todavía haberlos creado.
function previsualizarCodigoInterno(indiceEnLote){
  let maxNum = 0;
  for(const p of state.productos){
    const m = /^VP(\d+)$/i.exec(p.codigoInterno||'');
    if(m) maxNum = Math.max(maxNum, parseInt(m[1],10));
  }
  return 'VP' + String(maxNum + 1 + indiceEnLote).padStart(4,'0');
}

function stockPropio(prodId){
  let s = 0;
  for(const m of state.movimientos){
    if(m.productoId !== prodId) continue;
    if(m.tipo==='compra') s += m.cantidad;
    else if(m.tipo==='venta') s -= m.cantidad;
    else if(m.tipo==='envio_consignacion') s -= m.cantidad;
    else if(m.tipo==='merma') s -= m.cantidad;
    else if(m.tipo==='devolucion_consignacion') s += m.cantidad;
    else if(m.tipo==='produccion_terminado') s += m.cantidad;
    else if(m.tipo==='consumo_materia_prima') s -= m.cantidad;
    else if(m.tipo==='consumo_insumo') s -= m.cantidad;
  }
  return s;
}
function stockEnConsignacion(prodId){
  let s = 0;
  for(const m of state.movimientos){
    if(m.productoId !== prodId) continue;
    if(m.tipo==='envio_consignacion') s += m.cantidad;
    else if(m.tipo==='liquidacion_consignacion') s -= m.cantidad;
    else if(m.tipo==='devolucion_consignacion') s -= m.cantidad;
  }
  return s;
}
function stockEnConsignacionDetallado(){
  const map = {};
  for(const m of state.movimientos){
    if(m.tipo!=='envio_consignacion' && m.tipo!=='liquidacion_consignacion' && m.tipo!=='devolucion_consignacion') continue;
    const alias = (m.sobrenombre||'').trim();
    const key = m.productoId + '|' + alias;
    if(!map[key]) map[key] = {productoId:m.productoId, productoNombre:m.productoNombre, sobrenombre:alias, cantidad:0};
    if(m.tipo==='envio_consignacion') map[key].cantidad += m.cantidad;
    else map[key].cantidad -= m.cantidad;
  }
  return Object.values(map)
    .filter(x=>x.cantidad!==0)
    .sort((a,b)=> a.productoNombre.localeCompare(b.productoNombre) || a.sobrenombre.localeCompare(b.sobrenombre));
}
function sobrenombresDisponibles(prodId){
  return stockEnConsignacionDetallado().filter(x=>x.productoId===prodId && x.sobrenombre && x.cantidad>0);
}
function sobrenombresUsadosHistoricos(){
  const set = new Set();
  for(const m of state.movimientos){
    if(m.sobrenombre) set.add(m.sobrenombre.trim());
  }
  return [...set].sort();
}
function movimientosDePeriodo(periodoISO){
  return state.movimientos.filter(m => m.fecha && m.fecha.slice(0,7)===periodoISO);
}
function ingresosDePeriodo(periodoISO){
  const ms = movimientosDePeriodo(periodoISO);
  let directa = 0, consig = 0, revisiones = 0;
  for(const m of ms){
    if(m.tipo==='venta') directa += m.total;
    if(m.tipo==='liquidacion_consignacion') consig += m.total;
    if(m.tipo==='revision_adicional') revisiones += m.total;
  }
  return {directa, consig, revisiones, total: directa+consig+revisiones};
}
function mermasDePeriodo(periodoISO){
  const ms = movimientosDePeriodo(periodoISO).filter(m=>m.tipo==='merma');
  let valorCosto = 0, unidades = 0;
  for(const m of ms){
    const p = findProd(m.productoId);
    valorCosto += (p?p.costo:0) * m.cantidad;
    unidades += m.cantidad;
  }
  return {registros: ms, valorCosto, unidades};
}
function rankingVendidos(periodoISO){
  const ms = movimientosDePeriodo(periodoISO).filter(m=>m.tipo==='venta'||m.tipo==='liquidacion_consignacion');
  const map = {};
  for(const m of ms){
    if(!map[m.productoId]) map[m.productoId] = {productoId:m.productoId, nombre:m.productoNombre, cantidad:0, total:0};
    map[m.productoId].cantidad += m.cantidad;
    map[m.productoId].total += m.total;
  }
  return Object.values(map).sort((a,b)=>b.cantidad-a.cantidad);
}
function alertasAumentoCosto(){
  const hace30 = Date.now() - 30*24*3600*1000;
  return state.productos.filter(p=>{
    if(p.costoAnterior==null || !p.fechaCambioCosto) return false;
    if(p.costo <= p.costoAnterior) return false;
    return new Date(p.fechaCambioCosto).getTime() >= hace30;
  }).map(p=>{
    const variacion = ((p.costo - p.costoAnterior)/p.costoAnterior)*100;
    const margenOriginal = p.costoAnterior>0 ? (p.precioVenta - p.costoAnterior)/p.costoAnterior : 0;
    const sugerido = Math.round(p.costo*(1+margenOriginal)/10)*10;
    return {...p, variacion, sugerido};
  }).sort((a,b)=>b.variacion-a.variacion);
}
function margenPct(p){
  if(!p.costo) return 0;
  return ((p.precioVenta - p.costo)/p.costo)*100;
}

function costoInsumosPorUnidad(productoTerminadoId){
  const filas = recetaDe(productoTerminadoId);
  let total = 0;
  const detalle = [];
  for(const r of filas){
    const insumo = findProd(r.insumoId);
    const costoUnit = insumo ? (insumo.costo||0) : 0;
    const subtotal = costoUnit * (r.cantidadPorUnidad||0);
    total += subtotal;
    detalle.push({insumoId:r.insumoId, nombre: insumo?insumo.nombre:'(insumo eliminado)', cantidadPorUnidad:r.cantidadPorUnidad, costoUnit, subtotal});
  }
  return {total, detalle};
}

/* Costeo por absorción: materia prima + mano de obra (diseño) + proceso de venta (tinta, luz, insumos) + gastos indirectos.
   Si el producto tiene una receta detallada (materiaPrimaId + insumos), el costo de materia prima e insumos
   se deriva automáticamente de esa receta en vez de pedirlo a mano. */
function costeoAbsorcion(p){
  const tarifa = (p.tarifaHoraOverride!=null) ? p.tarifaHoraOverride : state.config.tarifaHoraDiseno;
  const pctInd = (p.gastosIndirectosPctOverride!=null) ? p.gastosIndirectosPctOverride : state.config.gastosIndirectosPct;
  const usaReceta = p.categoria==='producto_terminado' && !!p.materiaPrimaId;
  let materiales, proceso, pctProceso = null;
  if(usaReceta){
    const mp = findProd(p.materiaPrimaId);
    materiales = mp ? (mp.costo||0) : 0;
    proceso = costoInsumosPorUnidad(p.id).total;
  }else{
    materiales = p.costoMateriales || 0;
    pctProceso = (p.costoProcesoPctOverride!=null) ? p.costoProcesoPctOverride : state.config.costoProcesoPct;
    proceso = materiales * (pctProceso || 0) / 100;
  }
  const manoObra = (p.horasDiseno || 0) * tarifa;
  const directo = materiales + manoObra + proceso;
  const indirecto = directo * (pctInd || 0) / 100;
  const total = directo + indirecto;
  return {materiales, manoObra, proceso, directo, indirecto, total, tarifa, pctProceso, pctInd, usaReceta};
}

async function aplicarCosteoAbsorcion(p){
  const nuevo = Math.round(costeoAbsorcion(p).total);
  if(nuevo !== p.costo){
    p.costoAnterior = p.costo;
    p.fechaCambioCosto = hoyISO();
    p.costo = nuevo;
  }
}

    <div class="two-col">
      <div class="card">
        <div class="section-title">🏆 Más vendidos este mes</div>
        ${ranking.length ? `<canvas id="chartTop" height="170"></canvas>` : `<div class="empty">Todavía no hay ventas registradas este mes.</div>`}
      </div>
      <div class="card">
        <div class="section-title">⚠️ Aumentos de costo recientes</div>

              <div class="icon-sq badge-up">▲</div>
              <div>
                <div class="alert-txt">${escapeHtml(a.nombre)}</div>

        `).join('') : `<div class="empty">Sin aumentos de costo detectados en los últimos 30 días.</div>`}
      </div>
    </div>
  `;

  if(ranking.length){
    const ctx = document.getElementById('chartTop');
    new Chart(ctx, {
      type:'bar',
      data:{

        indexAxis:'y',
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>c.parsed.x+' unidades'}}},

    b.addEventListener('click', async ()=>{

      p.precioVenta = Number(b.dataset.sugerido);
      const ok = await saveProductos();
      if(ok) toast('Precio de venta actualizado');
      render();
    });
  });
}

      <div class="field">
        <label>% Gastos indirectos (default)</label>
        <input id="fGastosInd" type="number" value="${state.config.gastosIndirectosPct}">
        <div class="field-note">Alquiler, amortización de equipos, etc. — se asigna sobre el costo directo (materia prima + proceso + mano de obra) de cada producto.</div>
      </div>

      <div style="height:1px;background:var(--border);margin:16px 0;"></div>

      <div class="field">

        <input id="fCargoRevision" type="number" value="${state.config.cargoRevisionAdicional}">
        <div class="field-note">La primera revisión de un diseño va sin cargo. A partir de la segunda, se cobra este monto por revisión — se registra como movimiento junto con la venta.</div>
      </div>
      <div class="field">
        <label>Adicional por sublimado / personalización</label>
        <input id="fAdicionalSublimado" type="number" value="${state.config.adicionalSublimado}">
        <div class="field-note">Cuando creás un producto terminado nuevo desde "Sublimar", el precio de venta y de Plastipel se sugieren como el precio del bien en blanco + este adicional. Siempre lo podés ajustar a mano en ese momento.</div>
      </div>

      <div style="height:1px;background:var(--border);margin:16px 0;"></div>

      <div class="field">
        <label>Clave de acceso al panel</label>
        <input id="fClavePanel" type="text" value="${escapeHtml(state.config.clavePanel||'')}">

      <div class="field" id="syncRow" style="display:${state.config.backendUrl?'block':'none'};">

  document.body.appendChild(wrap);
  wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
  // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.

  wrap.querySelector('#fBackendUrl').addEventListener('input', (e)=>{
    wrap.querySelector('#syncRow').style.display = e.target.value.trim() ? 'block' : 'none';
  });
  wrap.querySelector('#btnProbarBackend').addEventListener('click', async ()=>{
    const urlTemp = wrap.querySelector('#fBackendUrl').value.trim();
    const estado = wrap.querySelector('#backendEstado');
    estado.textContent = 'Probando…'; estado.style.color = 'var(--ink-soft)';
    const urlOriginal = state.config.backendUrl;
    state.config.backendUrl = urlTemp;
    const r = await apiCall('ping');
    state.config.backendUrl = urlOriginal;
    if(r && r.ok){ estado.textContent = '✓ Conectado correctamente'; estado.style.color = 'var(--green)'; }
    else{ estado.textContent = '✕ No se pudo conectar — revisá la URL y que esté publicada como "Cualquier usuario"'; estado.style.color = 'var(--red)'; }
  });
  wrap.querySelector('#btnSincronizar').addEventListener('click', async ()=>{
    const urlTemp = wrap.querySelector('#fBackendUrl').value.trim();
    if(!urlTemp){ toast('Pegá primero la URL del backend'); return; }
    if(!confirm('Esto va a reemplazar los datos de la planilla con lo que tenés cargado ahora mismo en el panel (incluye todo el historial de movimientos). ¿Continuar?')) return;
    const btn = wrap.querySelector('#btnSincronizar');
    btn.textContent = 'Sincronizando…'; btn.disabled = true;
    const urlOriginal = state.config.backendUrl;
    state.config.backendUrl = urlTemp;
    const r = await apiCall('sincronizarInicial', {
      productos: state.productos,
      movimientos: state.movimientos,
      config: state.config,
      recetas: state.recetas,
    });
    state.config.backendUrl = urlOriginal;
    btn.disabled = false;
    btn.textContent = 'Sincronizar todo hacia el backend';
    if(r && r.ok) toast(`Sincronizado: ${r.productos} productos, ${r.movimientos} movimientos`);
    else toast('⚠️ No se pudo sincronizar. Revisá la URL y que el backend esté publicado.');
  });

  wrap.querySelector('#fLogo').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = async ()=>{
        const size = 300;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        const dataUrl = canvas.toDataURL('image/png');
        await setLogo(dataUrl);
        wrap.querySelector('.imgpick-round img').src = dataUrl;
        toast('Logo actualizado');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  wrap.querySelector('#saveBtn').addEventListener('click', async ()=>{
    const btn = wrap.querySelector('#saveBtn');
    const backendUrlAnterior = state.config.backendUrl;
    state.config.nombreEmprendimiento = wrap.querySelector('#fNombreNeg').value.trim() || window.BRAND_NAME_DEFAULT;
    state.config.tarifaHoraDiseno = Number(wrap.querySelector('#fTarifaHora').value)||0;
    state.config.costoProcesoPct = Number(wrap.querySelector('#fCostoProceso').value)||0;
    state.config.gastosIndirectosPct = Number(wrap.querySelector('#fGastosInd').value)||0;
    state.config.cargoRevisionAdicional = Number(wrap.querySelector('#fCargoRevision').value)||0;
    state.config.adicionalSublimado = Number(wrap.querySelector('#fAdicionalSublimado').value)||0;
    state.config.clavePanel = wrap.querySelector('#fClavePanel').value;
    state.config.whatsappNegocio = wrap.querySelector('#fWhatsapp').value.trim().replace(/[^\d]/g,'');
    state.config.backendUrl = wrap.querySelector('#fBackendUrl').value.trim();
    const seConectaBackendNuevo = state.config.backendUrl && state.config.backendUrl !== backendUrlAnterior;

    btn.textContent = seConectaBackendNuevo ? 'Trayendo tus datos…' : 'Guardando…';
    btn.disabled = true;

    if(seConectaBackendNuevo){
      // primero traemos lo que ya existe en la planilla, para no arriesgarnos a
      // pisarlo más tarde con datos locales viejos si se usa "Sincronizar todo"
      await recargarDatosPrincipal();
    }
    const ok = await saveConfig();
    btn.disabled = false;
    if(!ok){
      btn.textContent = 'Reintentar guardado';
      return; // deja el modal abierto con los valores cargados, listo para reintentar
    }
    wrap.remove();
    toast(seConectaBackendNuevo ? 'Conectado — se trajeron tus datos de la planilla' : 'Configuración guardada');
    render();
  });
}

function nombreMes(periodoISO){
  const [y,m] = periodoISO.split('-');
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return meses[Number(m)-1] + ' ' + y;
}
function truncate(s,n){ return s.length>n ? s.slice(0,n-1)+'…' : s; }
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML;
}

let prodCategoriaFiltro = 'todos';
let prodStockFiltro = 'todos'; // 'todos' | 'con_stock' | 'sin_stock'
function categoriaBadge(categoria, prodId){
  const etiquetas = {
    materia_prima: '🧱 Materia prima',

    producto_terminado: '🏷️ Terminado',

  return `<button type="button" class="badge badge-gray" data-cambiar-categoria="${prodId}" title="Tocá para cambiar la categoría">${texto} ✎</button>`;
}

        <thead><tr>

let prodRenderGen = 0;
async function renderProductosBody(main){
  const miGen = ++prodRenderGen;
  const alertaIds = new Set(alertasAumentoCosto().map(a=>a.id));
  const term = prodFiltro.trim().toLowerCase();
  const lista = state.productos.filter(p =>
    (prodCategoriaFiltro==='todos' || (p.categoria||'producto_terminado')===prodCategoriaFiltro) &&
    (!term || p.nombre.toLowerCase().includes(term) || (p.codigo||'').toLowerCase().includes(term)) &&
    (prodStockFiltro==='todos' || (prodStockFiltro==='con_stock' ? stockPropio(p.id)>0 : stockPropio(p.id)<=0))
  );

  const tbody = document.getElementById('prodBody');
  const emptyBox = document.getElementById('prodEmpty');
  if(!tbody) return; // la vista cambió mientras se buscaba
  tbody.innerHTML = '';
  emptyBox.innerHTML = !lista.length ? '<div class="empty">No se encontraron productos.</div>' : '';

  for(const p of lista){
    if(miGen !== prodRenderGen) return; // una búsqueda más nueva ya está en curso: abandonar esta
    const tr = document.createElement('tr');
    const imgBlanco = await getImage(p.id, 'blanco');
    const imgSublimado = await getImage(p.id, 'sublimado');
    const stock = stockPropio(p.id);
    const m = margenPct(p);
    tr.innerHTML = `
      <td>
        <div class="prod-cell">
          <div style="display:flex;gap:4px;flex-shrink:0;">
            <label class="prod-thumb-empty" style="cursor:pointer;overflow:hidden;position:relative;" title="Foto sin sublimar (blanco)">
              ${imgBlanco ? `<img class="prod-thumb" src="${imgBlanco}" style="position:absolute;inset:0;">` : '🖼'}
              <input type="file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;" data-img-for="${p.id}" data-img-tipo="blanco">
            </label>
            <label class="prod-thumb-empty" style="cursor:pointer;overflow:hidden;position:relative;border-color:var(--teal);" title="Foto sublimada (ejemplo)">
              ${imgSublimado ? `<img class="prod-thumb" src="${imgSublimado}" style="position:absolute;inset:0;">` : '🔥'}
              <input type="file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;" data-img-for="${p.id}" data-img-tipo="sublimado">
            </label>
          </div>
          <div style="min-width:0;flex:1;">
            <div class="value-view" data-field="nombre" data-id="${p.id}">
              <span class="value-text name-text">${escapeHtml(p.nombre)}</span>
              <button type="button" class="pencil-btn" data-edit="nombre" data-id="${p.id}" title="Editar nombre">✎</button>
              ${alertaIds.has(p.id)?'<span class="badge badge-up">▲ costo</span>':''}
              ${categoriaBadge(p.categoria, p.id)}
            </div>
            <div class="prod-code mono">${escapeHtml(p.codigoInterno||'—')} · ${escapeHtml(p.codigo||'—')}</div>
            <div class="field-note" style="margin:2px 0 0;">🖼 sin sublimar · 🔥 sublimado (ejemplo)</div>
          </div>
        </div>
      </td>
      <td>
        <div class="costo-cell" data-costeo="${p.id}">
          <span class="costo-total">${money(p.costo)}</span>
          <span class="costo-caret">▸ detalle</span>
        </div>
      </td>
      <td>
        <div class="value-view" data-field="precioVenta" data-id="${p.id}">
          <span class="value-text mono">${money(p.precioVenta)}</span>
          <button type="button" class="pencil-btn" data-edit="precioVenta" data-id="${p.id}" title="Editar precio de venta">✎</button>
        </div>
      </td>
      <td>
        <div class="value-view" data-field="precioConsignacion" data-id="${p.id}">
          <span class="value-text mono">${money(p.precioConsignacion)}</span>
          <button type="button" class="pencil-btn" data-edit="precioConsignacion" data-id="${p.id}" title="Editar precio Plastipel">✎</button>
        </div>
      </td>
      <td><span class="badge ${m>=40?'badge-green':m>=15?'badge-gray':'badge-red'}">${m.toFixed(0)}%</span></td>
      <td><span class="mono" style="font-weight:600;">${stock}</span></td>
      <td><button class="btn-icon" data-del="${p.id}" title="Eliminar">✕</button></td>
    `;
    if(miGen !== prodRenderGen) return; // la búsqueda cambió mientras cargaba esta fila: descartarla
    tbody.appendChild(tr);
  }
  if(miGen !== prodRenderGen) return; // resultado obsoleto, no adjuntar listeners

  if(!tbody.dataset.pencilBound){
    tbody.dataset.pencilBound = '1';
    tbody.addEventListener('click', (e)=>{
      const btn = e.target.closest('.pencil-btn[data-edit]');
      if(!btn) return;
      const field = btn.dataset.edit;
      const id = btn.dataset.id;
      const p = findProd(id);
      if(!p) return;
      const container = btn.closest('.value-view');
      const esTexto = field==='nombre';
      const valorActual = esTexto ? p.nombre : p[field];
      container.innerHTML = `
        <input class="editable ${esTexto?'editable-name':''}" type="${esTexto?'text':'number'}" value="${esTexto?escapeHtml(valorActual):valorActual}">
        <button type="button" class="pencil-btn pencil-ok" title="Guardar">✓</button>
        <button type="button" class="pencil-btn pencil-cancel" title="Cancelar">✕</button>
      `;
      const input = container.querySelector('input');
      input.focus();
      input.select();

      const guardar = async ()=>{
        if(esTexto){
          const nuevoNombre = input.value.trim();
          if(!nuevoNombre){ toast('El nombre no puede quedar vacío'); return; }
          p.nombre = nuevoNombre;
        }else{
          const val = Number(input.value)||0;
          if(field==='costo' && val !== p.costo){
            p.costoAnterior = p.costo;
            p.fechaCambioCosto = hoyISO();
          }
          p[field] = val;
        }
        const ok = await saveProductos();
        if(ok) toast('Guardado');
        renderProductosBody(main);
      };
      const cancelar = ()=>renderProductosBody(main);

      container.querySelector('.pencil-ok').addEventListener('click', guardar);
      container.querySelector('.pencil-cancel').addEventListener('click', cancelar);
      input.addEventListener('keydown', (ev)=>{
        if(ev.key==='Enter'){ ev.preventDefault(); guardar(); }
        if(ev.key==='Escape'){ ev.preventDefault(); cancelar(); }
      });
    });
  }
  tbody.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('¿Eliminar este producto? No se borra su historial de movimientos.')) return;
      const respaldo = state.productos;
      state.productos = state.productos.filter(p=>p.id!==b.dataset.del);
      const ok = await saveProductos();
      if(!ok){ state.productos = respaldo; renderProductosBody(main); return; }

      renderProductosBody(main);
    });

    inp.addEventListener('change', (e)=>handleImageUpload(e, inp.dataset.imgFor, ()=>renderProductosBody(main), inp.dataset.imgTipo||'blanco'));

    cell.addEventListener('click', ()=>openCosteoModal(cell.dataset.costeo, ()=>renderProductosBody(main)));

  tbody.querySelectorAll('[data-cambiar-categoria]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openCambiarCategoriaModal(btn.dataset.cambiarCategoria, ()=>renderProductosBody(main));
    });
  });
}

function openCosteoModal(prodId, onDone){
  const p = findProd(prodId);

  // Materia prima e insumos: costeo simple, solo el costo de compra
  if(p.categoria==='materia_prima' || p.categoria==='insumo'){
    openCostoSimpleModal(p, onDone);
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  const materiasPrimas = state.productos.filter(x=>x.categoria==='materia_prima');
  const insumos = state.productos.filter(x=>x.categoria==='insumo');
  const recetaActual = recetaDe(p.id);

  wrap.innerHTML = `
    <div class="modal">
      <h3>Costeo por absorción</h3>
      <p class="view-sub" style="margin:0 0 14px;">${escapeHtml(p.nombre)}</p>

      <div class="field">
        <label>Materia prima vinculada</label>
        <select id="fMateriaPrimaId">
          <option value="">— Cargar el costo a mano (sin vincular) —</option>
          ${materiasPrimas.map(mp=>`<option value="${mp.id}" ${p.materiaPrimaId===mp.id?'selected':''}>${escapeHtml(mp.nombre)} (${money(mp.costo)})</option>`).join('')}
        </select>
        <div class="field-note">Si la vinculás, el costo de materia prima se toma solo del costo de compra de ese producto (se actualiza cada vez que registrás una compra).</div>
      </div>
      <div class="field" id="fldMaterialesManual"><label>Materia prima (superficie a sublimar)</label><input id="fMateriales" type="number" value="${p.costoMateriales||0}"></div>

      <div id="fldReceta" style="display:none;">
        <label style="display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;">Insumos que consume por unidad (tinta, vinilo, etc.)</label>
        <div id="recetaRows"></div>
        <button type="button" class="btn btn-outline btn-sm" id="btnAgregarInsumo" style="margin-top:6px;">+ Agregar insumo</button>
        <div class="field-note" style="margin-top:8px;">La cantidad va en la unidad que uses para comprar ese insumo (ej: ml, gramos).</div>
      </div>

      <div style="height:1px;background:var(--border);margin:16px 0;"></div>

      <div class="field-row">
        <div class="field"><label>Horas de diseño</label><input id="fHoras" type="number" step="0.25" value="${p.horasDiseno||0}"></div>
        <div class="field"><label>Tarifa por hora</label><input id="fTarifa" type="number" value="${(p.tarifaHoraOverride!=null)?p.tarifaHoraOverride:state.config.tarifaHoraDiseno}"></div>
      </div>
      <div class="field-note" style="margin:-8px 0 12px;">Por defecto usa la tarifa global (${money(state.config.tarifaHoraDiseno)}/h). Podés pisarla acá solo para este producto.</div>

      <div class="field" id="fldPctProceso"><label>% Costo de proceso de venta</label><input id="fPctProceso" type="number" value="${(p.costoProcesoPctOverride!=null)?p.costoProcesoPctOverride:state.config.costoProcesoPct}"></div>
      <div class="field-note" id="notaPctProceso" style="margin:-8px 0 12px;">Tinta, luz y demás insumos del proceso de sublimado — % sobre la materia prima. Default global: ${state.config.costoProcesoPct}%.</div>

      <div class="field"><label>% Gastos indirectos asignados</label><input id="fPctInd" type="number" value="${(p.gastosIndirectosPctOverride!=null)?p.gastosIndirectosPctOverride:state.config.gastosIndirectosPct}"></div>
      <div class="field-note" style="margin:-8px 0 12px;">Alquiler, amortización de equipos, etc. — % sobre el costo directo. Default global: ${state.config.gastosIndirectosPct}%.</div>

      <div class="breakdown-box" id="breakdownBox"></div>

      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar costeo</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  function pintarFilasReceta(filas){
    const cont = wrap.querySelector('#recetaRows');
    cont.innerHTML = filas.map((f,i)=>`
      <div class="field-row" data-fila="${i}" style="margin-bottom:8px;align-items:flex-end;">
        <div class="field" style="margin-bottom:0;">
          <select class="receta-insumo">
            ${insumos.map(ins=>`<option value="${ins.id}" ${f.insumoId===ins.id?'selected':''}>${escapeHtml(ins.nombre)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="margin-bottom:0;display:flex;gap:6px;">
          <input class="receta-cantidad" type="number" step="0.01" value="${f.cantidadPorUnidad||0}" style="flex:1;">
          <button type="button" class="btn-icon receta-quitar" title="Quitar">✕</button>
        </div>
      </div>
    `).join('') || '<div class="field-note">Sin insumos cargados todavía.</div>';
    cont.querySelectorAll('.receta-quitar').forEach(b=>{
      b.addEventListener('click', ()=>{
        const fila = b.closest('[data-fila]');
        const idx = Number(fila.dataset.fila);
        filasReceta.splice(idx,1);
        pintarFilasReceta(filasReceta);
        recalcular();
      });
    });
    cont.querySelectorAll('.receta-insumo, .receta-cantidad').forEach(el=>{
      el.addEventListener('input', ()=>{
        filasReceta = leerFilasReceta();
        recalcular();
      });
    });
  }
  function leerFilasReceta(){
    return [...wrap.querySelectorAll('#recetaRows [data-fila]')].map(fila=>({
      insumoId: fila.querySelector('.receta-insumo').value,
      cantidadPorUnidad: Number(fila.querySelector('.receta-cantidad').value)||0,
    }));
  }
  let filasReceta = recetaActual.map(r=>({insumoId:r.insumoId, cantidadPorUnidad:r.cantidadPorUnidad}));
  if(insumos.length) pintarFilasReceta(filasReceta);
  else wrap.querySelector('#recetaRows').innerHTML = '<div class="field-note">Todavía no cargaste ningún insumo (tinta, vinilo, etc.) como producto. Agregalos desde "+ Nuevo producto" con la categoría "Insumo".</div>';

  wrap.querySelector('#btnAgregarInsumo').addEventListener('click', ()=>{
    if(!insumos.length){ toast('Primero cargá al menos un insumo'); return; }
    filasReceta.push({insumoId: insumos[0].id, cantidadPorUnidad: 0});
    pintarFilasReceta(filasReceta);
    recalcular();
  });

  function actualizarModoMateriaPrima(){
    const vinculada = wrap.querySelector('#fMateriaPrimaId').value;
    const usaReceta = !!vinculada;
    wrap.querySelector('#fldMaterialesManual').style.display = usaReceta ? 'none' : '';
    wrap.querySelector('#fldReceta').style.display = usaReceta ? '' : 'none';
    wrap.querySelector('#fldPctProceso').style.display = usaReceta ? 'none' : '';
    wrap.querySelector('#notaPctProceso').style.display = usaReceta ? 'none' : '';
  }
  wrap.querySelector('#fMateriaPrimaId').addEventListener('change', ()=>{ actualizarModoMateriaPrima(); recalcular(); });
  actualizarModoMateriaPrima();

  function recalcular(){
    const materiaPrimaId = wrap.querySelector('#fMateriaPrimaId').value;
    const horas = Number(wrap.querySelector('#fHoras').value)||0;
    const tarifa = Number(wrap.querySelector('#fTarifa').value)||0;
    const pctInd = Number(wrap.querySelector('#fPctInd').value)||0;
    let materiales, proceso, pctProceso = 0, detalleInsumos = [];

    if(materiaPrimaId){
      const mp = findProd(materiaPrimaId);
      materiales = mp ? (mp.costo||0) : 0;
      proceso = 0;
      for(const f of leerFilasReceta()){
        const ins = findProd(f.insumoId);
        const costoUnit = ins ? (ins.costo||0) : 0;
        const subtotal = costoUnit * f.cantidadPorUnidad;
        proceso += subtotal;
        detalleInsumos.push({nombre: ins?ins.nombre:'—', cantidad:f.cantidadPorUnidad, subtotal});
      }
    }else{
      materiales = Number(wrap.querySelector('#fMateriales').value)||0;
      pctProceso = Number(wrap.querySelector('#fPctProceso').value)||0;
      proceso = materiales*pctProceso/100;
    }

    const manoObra = horas*tarifa;
    const directo = materiales+manoObra+proceso;
    const indirecto = directo*pctInd/100;
    const total = directo+indirecto;

    wrap.querySelector('#breakdownBox').innerHTML = `
      <div class="breakdown-row"><span>Materia prima${materiaPrimaId?' (vinculada)':''}</span><b>${money(materiales)}</b></div>
      <div class="breakdown-row"><span>Mano de obra (${horas} h × ${money(tarifa)})</span><b>${money(manoObra)}</b></div>
      ${materiaPrimaId
        ? detalleInsumos.map(d=>`<div class="breakdown-row"><span>· ${escapeHtml(d.nombre)} (${d.cantidad})</span><b>${money(d.subtotal)}</b></div>`).join('') || '<div class="breakdown-row"><span>Insumos</span><b>$0</b></div>'
        : `<div class="breakdown-row"><span>Proceso de venta — tinta/luz (${pctProceso}%)</span><b>${money(proceso)}</b></div>`
      }
      <div class="breakdown-row"><span>Costo directo</span><b>${money(directo)}</b></div>
      <div class="breakdown-row"><span>Gastos indirectos (${pctInd}%)</span><b>${money(indirecto)}</b></div>
      <div class="breakdown-row total"><span>Costo total por absorción</span><span>${money(total)}</span></div>
    `;
    return {materiaPrimaId, materiales, horas, tarifa, pctProceso, pctInd, total};
  }
  wrap.querySelectorAll('input, select').forEach(i=>i.addEventListener('input', recalcular));
  recalcular();

  wrap.querySelector('#cancelBtn').addEventListener('click', ()=>wrap.remove());
  // El modal ya NO se cierra solo al tocar afuera del cuadro — así no se pierde lo cargado por error.
  wrap.querySelector('#saveBtn').addEventListener('click', async ()=>{
    const btn = wrap.querySelector('#saveBtn');
    const vals = recalcular();
    p.materiaPrimaId = vals.materiaPrimaId || null;
    if(!vals.materiaPrimaId){
      p.costoMateriales = vals.materiales;
    }
    p.horasDiseno = vals.horas;
    p.tarifaHoraOverride = (vals.tarifa===state.config.tarifaHoraDiseno) ? null : vals.tarifa;
    p.costoProcesoPctOverride = vals.materiaPrimaId ? null : ((vals.pctProceso===state.config.costoProcesoPct) ? null : vals.pctProceso);
    p.gastosIndirectosPctOverride = (vals.pctInd===state.config.gastosIndirectosPct) ? null : vals.pctInd;

    const nuevasFilas = vals.materiaPrimaId ? leerFilasReceta().filter(f=>f.insumoId && f.cantidadPorUnidad>0) : [];
    state.recetas = state.recetas.filter(r=>r.productoTerminadoId!==p.id);
    nuevasFilas.forEach(f=>{
      state.recetas.push({id: uid('r'), productoTerminadoId: p.id, insumoId: f.insumoId, cantidadPorUnidad: f.cantidadPorUnidad});
    });
    await aplicarCosteoAbsorcion(p); // recalcula ya con la receta actualizada en state.recetas

    btn.textContent = 'Guardando…'; btn.disabled = true;
    const ok1 = await saveProductos();
    const ok2 = await saveRecetas();
    btn.disabled = false;
    if(!ok1 || !ok2){ btn.textContent = 'Reintentar guardado'; return; }
    wrap.remove();
    toast('Costeo actualizado');
    onDone();
  });
}

function handleImageUpload(e, prodId, onDone, tipo='blanco'){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = async () => {
      const maxW = 480;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      const guardadaOk = await setImage(prodId, dataUrl, tipo);
      if(guardadaOk){
        const p = findProd(prodId);
        if(p && !p.imagenUrl && !p.imagenSublimadaUrl){ p.tieneImagen = true; await saveProductos(); }
        toast('Imagen actualizada');
      }
      onDone();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
